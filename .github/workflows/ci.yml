name: ci
on: {push: {branches: [main]}, pull_request: {}}
permissions: {contents: write}
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: {version: "0.13.6"}
      - run: uv sync --locked
      - run: uv run python scripts/validate_schema.py
      - run: uv run python scripts/build_docs.py
      - name: fail if generated docs are stale
        run: git diff --exit-code -- docs/standard
      - run: uv run mkdocs build --strict
      - name: deploy site (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name github-actions && git config user.email github-actions@github.com
          uv run mike deploy --push --update-aliases dev latest
