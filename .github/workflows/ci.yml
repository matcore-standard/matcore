name: ci
on: {push: {branches: [main], tags: ['v*']}, pull_request: {}}
permissions: {contents: write}
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with: {version: "0.13.6"}
      - run: uv sync --locked
      - run: uv run python scripts/validate_schema.py
      - run: uv run python scripts/build_docs.py --show-legacy  # until step 5 fills every typed field
      - name: fail if generated docs are stale
        run: git diff --exit-code -- docs/standard
      - run: uv run mkdocs build --strict
      # Versions (decision 0010): main deploys the unreleased `dev`; a tag vX.Y.Z deploys X.Y.Z and moves `latest`.
      - name: deploy dev (push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name github-actions && git config user.email github-actions@github.com
          uv run mike deploy --push dev
      - name: deploy release (tag vX.Y.Z matching the newest entry of schema/releases.yaml)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          current=$(uv run python -c 'import yaml; print(yaml.safe_load(open("schema/releases.yaml"))["releases"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$current" || { echo "tag $GITHUB_REF_NAME does not match releases.yaml ($current)"; exit 1; }
          git config user.name github-actions && git config user.email github-actions@github.com
          uv run mike deploy --push --update-aliases "$current" latest
