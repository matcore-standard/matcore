section: gc
title: 2.9 Geometric Construction (GC) Metadata
introduction: |
  The metadata for geometric construction (MatCore-GC) is tabulated below. A geometric construction builds structures by rules the author specifies, without evaluating energies or forces and without a model learned from data: stacking or cutting a lattice, joining two crystals at an interface, inserting defects, displacing or straining atoms, enumerating or randomly generating arrangements, or converting a mesoscale configuration into atoms. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below.)

  Such a computation has the method GC and, usually, the task Structure generation in minimal `computation`; the computations that use its structures name it in `input` with the role Initial configuration. Structures generated by a model learned from data are described in ML, and a search that relaxes its candidates in PS. The properties are given in settings blocks, each naming the computations it describes.
examples:
  - caption: Geometric Construction Metadata
    file: gc.json
    source: Illustrative example, not taken from a published dataset.
legacy_complete: true
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: procedure
    required: true
    description: How the structures were built.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
    notes:
    - >-
      Note: Give the rules applied, in the order applied, and the role of each `construction-parameter` entry,
      e.g. "Cu(111) and Nb(110) slabs joined in the Kurdjumov-Sachs orientation relationship; the lateral mismatch
      is shared equally between the two slabs."
  - name: construction-parameter
    required: false
    description: A parameter of the construction.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    notes:
    - >-
      Note: For example, a layer thickness, a strain tolerance, a displacement amplitude, a vacuum width or the
      number of dislocations converted.
    subproperties:
    - name: name
      required: true
      description: The designation of the construction parameter.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: value
      required: true
      description: The data associated with the construction parameter.
      type: any
      extent: any
      kind: any
      recommended-unit: null
      values: null
      repeatable: false
    - name: unit
      required: false
      description: The unit in which the associated value is expressed.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
          only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
          (accepted with a validation warning).
      repeatable: false
      notes:
      - 'Note: Give it when the type of the value is float or int; omit it when it is string or bool.'
    - name: description
      required: false
      description: An explanation of the meaning, source, or purpose of the construction parameter.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
