section: ml
title: 2.6 Machine Learning (ML) Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The metadata for Machine Learning (ML) data (MatCore-ML) is tabulated below. This metadata documents key aspects of the ML method to provide understanding of the dataset generated by it. The properties are given in settings blocks, each naming the ML computations it describes. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below.)
examples:
  - caption: ML Method-Specific Metadata
    file: ml.json
    source: https://figshare.com/articles/dataset/WyFormer_generated_structures/29094701
legacy_complete: true
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: ml-task
    required: true
    description: Characterization of the machine learning process performed.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    subproperties:
    - name: type
      required: true
      description: The nature of the machine learning task.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Property prediction, Structure generation, Synthesis prediction, Ranking, Clustering, Embedding]
        note: >-
          "Property prediction" – Values of a property predicted for given materials or structures, e.g.
          formation energies or band gaps. "Structure generation" – New structures produced by the model,
          freely or for a given composition, space group or target property, including crystal structure
          prediction for a given composition. "Synthesis prediction" – Routes, precursors or conditions
          predicted for making a given material. "Ranking" – Given materials or structures ordered by a
          predicted score, e.g. to select candidates for further calculation. "Clustering" – Given materials
          or structures grouped by similarity. "Embedding" – A numerical representation computed for each
          given material or structure, for use by other models or analyses.
      repeatable: true
      notes:
      - >-
        Note: This Property can be repeated if the machine learning task involves multiple types of calculations.
      - >-
        Note: A machine-learned interatomic potential is not described here; it is a particle interaction model
        (pim, theory-level Machine-learned).
    - name: description
      required: false
      description: Explanation of the machine learning task performed.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
  - name: ml-model
    required: true
    description: >-
      A comprehensive description of the machine learning approach and architecture used.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    notes:
    - >-
      Note: An inference computation whose model is trained in another computation of the record gives only
      algorithm and target-variable, to identify the model; the training computation's settings describe the
      rest.
    subproperties:
    - name: algorithm
      required: true
      description: The machine learning method used.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        examples: [Neural network, Random forest, Gaussian process]
      repeatable: false
    - name: target-variable
      required: true
      description: The desired output or answer the machine learning model aims to predict.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: true
    - name: input-feature
      required: false
      description: Information provided to the machine learning method.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          The form and meaning of an input variable or feature, e.g. a graph representation of a crystal
          structure, including any feature engineering performed to define it (e.g. dimensionality reduction,
          clustering).
      repeatable: true
    - name: model-architecture
      required: false
      description: A description of the network topology used by the specified algorithm.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          E.g. for a neural network, the kinds of layers and how they are connected. Explain the role of each
          architecture-parameter entry.
      repeatable: false
    - name: architecture-parameter
      required: false
      description: A fixed variable that defines the architecture of the machine learning model.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: For example, the number of layers, the number of nodes per layer, a cutoff radius or a maximum
        body order. Training settings are hyperparameter entries of training-method.
      subproperties:
      - name: name
        required: true
        description: The designation of the architecture parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: value
        required: true
        description: The data associated with the architecture parameter.
        type: any
        extent: any
        kind: any
        recommended-unit: null
        values: null
        repeatable: false
      - name: unit
        required: true
        description: The unit in which the associated value is expressed.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
            only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
            (accepted with a validation warning).
        repeatable: false
      - name: description
        required: false
        description: An explanation of the meaning, source, or purpose of the architecture parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: model-size
      required: false
      description: The number of trainable parameters of the machine learning model.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
      repeatable: false
    - name: training-data
      required: false
      description: The information used for parameterizing the machine learning model.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      subproperties:
      - name: name
        required: true
        description: Name of the training dataset used to train in the machine learning model.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: contents
        required: true
        description: Description of the information included in the training dataset.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. DFT calculations or experiments, and what one item of the data is (a structure, a
            configuration), since size counts items.
        repeatable: false
      - name: source
        required: false
        description: Location from which the training data was obtained.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            A MatCore ID, web address, DOI, citation, or other description of where the data was
            obtained. Training data produced by a computation of the record is not given here: the
            training computation names it in minimal `computation › input` with the role Training
            data.
        repeatable: false
      - name: size
        required: false
        description: Number of items in the training dataset.
        type: int
        extent: []
        kind: dimensionless
        recommended-unit: null
        values:
          minimum: 1
          note: >-
            The kind of item is stated in contents.
        repeatable: false
      - name: data-preprocessing
        required: false
        description: >-
          Approach used for preliminary refining of raw, unformatted, or incomplete information into a structured
          and clean state suitable for modeling or analysis.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: missing-data
        required: false
        description: >-
          Documentation of incomplete, null, or unrecorded entries within a feature set that hinder algorithm
          training.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. the percentage of missing data, and which fields are missing and why.
        repeatable: false
      - name: missing-data-strategy
        required: false
        description: >-
          Approach used for filling in or removing blank, null, or unknown entries in a dataset.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: outlier-handling
        required: false
        description: >-
          Approach to identifying and addressing extreme observations that deviate significantly from the
          general distribution to ensure they do not disproportionately skew model training.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: dataset-split
        required: false
        description: >-
          A description of how information used to train the machine learning model was divided into subsets
          as part of the training process.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            In words, e.g. a random split of 80/10/10 into training, validation and test sets, a split
            stratified by composition, or k-fold cross-validation.
        repeatable: false
    - name: training-method
      required: false
      description: The approach used to determine the machine learning model's free parameters.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: training-procedure
        required: true
        description: The methodology used to determine the machine learning model's free parameters.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. the optimizer (Adam, L-BFGS, closed-form least squares), the learning-rate schedule, the
            stopping rule, and any active-learning loop with its selection criterion (e.g. query by committee,
            an uncertainty threshold). Explain the role of each hyperparameter entry.
        repeatable: false
      - name: loss-function
        required: false
        description: The quantities fitted in training and how they are weighted.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. the mean squared error of formation energies, or a weighted sum of the errors in energies,
            forces and stresses with weights 1:100:10.
        repeatable: false
      - name: hyperparameter
        required: false
        description: A fixed variable that controls the fitting of the machine learning model.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: true
        notes:
        - >-
          Note: For example, the learning rate, the batch size, the number of epochs or the early-stopping
          patience. Numbers that fix the model's architecture are architecture-parameter entries of ml-model.
        subproperties:
        - name: name
          required: true
          description: The designation of the hyperparameter.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values: null
          repeatable: false
        - name: value
          required: true
          description: The data associated with the hyperparameter.
          type: any
          extent: any
          kind: any
          recommended-unit: null
          values: null
          repeatable: false
        - name: unit
          required: true
          description: The unit in which the associated value is expressed.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            note: >-
              A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
              only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
              (accepted with a validation warning).
          repeatable: false
        - name: description
          required: false
          description: An explanation of the meaning, source, or purpose of the hyperparameter.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values: null
          repeatable: false
      - name: transfer-learning
        required: false
        description: >-
          Method used to migrate knowledge from previously mastered objectives to accelerate proficiency for
          the current machine learning task.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. fine-tuning, domain adaptation, multi-task learning or delta learning, with the details of
            how it was applied.
        repeatable: false
    - name: model-performance
      required: false
      description: An assessment of the reliability of the machine learning results.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: evaluation-method
        required: true
        description: >-
          A description of the approach used to determine the reliability of the obtained machine learning
          results.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. a hold-out test set or k-fold cross-validation. Validation data serve to tune the model's
            hyperparameters or stop its training; test data, used for neither, assess it. The scores are metric
            entries.
        repeatable: true
      - name: metric
        required: false
        description: A score of the machine learning model on one subset of the data.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: true
        subproperties:
        - name: subset
          required: true
          description: The data on which the score was measured.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            terms: [Training, Validation, Test]
            note: >-
              "Training" – The data the model's parameters were fitted to. "Validation" – Data used to tune
              hyperparameters or to stop training. "Test" – Data used in neither, which assesses the model.
          repeatable: false
        - name: quantity
          required: true
          description: The target variable the score is for.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            examples: [Formation energy, Forces]
          repeatable: false
        - name: measure
          required: true
          description: The statistic used as the score.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            terms: [MAE, RMSE, R², Accuracy]
            note: >-
              "MAE" – Mean absolute error. "RMSE" – Root-mean-square error. "R²" – Coefficient of
              determination. "Accuracy" – Fraction of correct predictions, for a classification.
          repeatable: false
        - name: value
          required: true
          description: The value of the property, in the unit given by `unit`.
          type: float
          extent: []
          kind: any
          recommended-unit: null
          values: null
          repeatable: false
        - name: unit
          required: true
          description: The unit in which the associated value is expressed.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            note: >-
              A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and only
              if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression (accepted
              with a validation warning).
          repeatable: false
      - name: uncertainty-quantification
        required: false
        description: >-
          The method or process used to identify and measure the range of possible outcomes to assess the
          reliability of machine learning model predictions.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. Bayesian methods, dropout, ensemble methods or a Gaussian process. Say whether an uncertainty
            for each item is part of the dataset.
        repeatable: false
      - name: applicability-domain
        required: false
        description: Where the inputs the model is applied to lie relative to its training data.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. the elements, structure types or range of compositions the training data cover, and how inputs
            outside them were identified (a distance in feature space, an uncertainty threshold).
        repeatable: false
    - name: interpretability-method
      required: false
      description: >-
        A technique used to understand the cause-and-effect relationships within the machine learning model's
        inputs and outputs.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          The approach and results of the interpretability analysis, e.g. feature importance, global surrogate
          models, LIME (Local Interpretable Model-agnostic Explanations), SHAP (SHapley Additive exPlanations)
          or saliency maps.
      repeatable: false
  - name: inference
    required: false
    description: How the dataset was produced from the machine learning model.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    notes:
    - >-
      Note: Give it for a computation that applies a trained model, e.g. one whose task is Structure generation
      or Property calculation.
    subproperties:
    - name: input-data
      required: false
      description: What the machine learning model was applied to.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          E.g. a list of candidate compositions or a screening set of structures. Data from a computation
          of the record is named in minimal `computation › input` instead, e.g. with the role Source data.
      repeatable: false
    - name: conditioning
      required: false
      description: The targets imposed on a generative model's outputs.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          E.g. a space group, a composition or a range of a property.
      repeatable: false
    - name: sampling-procedure
      required: false
      description: How the outputs were drawn from the machine learning model.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          E.g. autoregressive sampling at a given temperature, beam search, or one prediction per input.
          Explain the role of each inference-parameter entry.
      repeatable: false
    - name: inference-parameter
      required: false
      description: A fixed variable that controls the application of the machine learning model.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: For example, the sampling temperature, the number of samples drawn or the beam width.
      subproperties:
      - name: name
        required: true
        description: The designation of the inference parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: value
        required: true
        description: The data associated with the inference parameter.
        type: any
        extent: any
        kind: any
        recommended-unit: null
        values: null
        repeatable: false
      - name: unit
        required: true
        description: The unit in which the associated value is expressed.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
            only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
            (accepted with a validation warning).
        repeatable: false
      - name: description
        required: false
        description: An explanation of the meaning, source, or purpose of the inference parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: number-generated
      required: false
      description: The number of outputs of the machine learning model kept in the dataset.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
        note: >-
          A number drawn before filtering is stated in filtering.
      repeatable: false
    - name: filtering
      required: false
      description: What was removed from or kept among the model's outputs.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          E.g. validity checks, deduplication, novelty against the training data or a stability
          pre-screen, with the fraction removed by each. Checks on the generated set (the fraction
          valid, unique or novel) are given here, as they describe the output, not the model.
      repeatable: false
