section: mbpt
title: 2.5 Many-Body Perturbation Theory (MBPT) Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The metadata for Many-Body Perturbation Theory (MBPT) data (MatCore-MBPT) is tabulated below. This includes the MBPT method, dielectric treatment, and associated parameters. The properties are given in settings blocks, each naming the MBPT computations it describes. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below. The DFT computation an MBPT computation starts from is described by MatCore-DFT and named in its `input` with the role Starting point.)
examples:
  - caption: MBPT Method-Specific Metadata
    file: mbpt.json
    source: https://archive.materialscloud.org/record/2023.92
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: mbpt-method
    required: true
    description: The many-body perturbation theory (MBPT) approach used and associated settings.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    subproperties:
    - name: type
      required: true
      description: The nature of the MBPT calculation performed.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [GW, BSE, GW/BSE]
        note: >-
          "GW" – A GW calculation of quasiparticle energies. "BSE" – A BSE calculation of neutral excitations
          from given quasiparticle energies, e.g. DFT energies with a scissor shift, the computation they come
          from named in minimal `computation › input` with the role Starting point. "GW/BSE" – A GW calculation
          followed by a BSE calculation using its results, described as one computation.
      repeatable: false
    - name: gw-self-consistency
      required: false
      description: >-
        Specifies the level of iterative updating applied to the Green's function (*G*) and the screened Coulomb
        interaction (*W*) in the GW calculation. This property identifies whether the GW equations are solved in
        a 'one-shot' perturbative manner or through an iterative cycle where the quasiparticle states are updated
        to reach a self-consistent solution.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [G0W0, GW0, G0W, evGW, scGW, QSGW]
        note: >-
          "G0W0" – One-shot calculation; *G*₀ and *W*₀ are constructed using the starting eigenvalues and
          wavefunctions. "GW0" – Only the Green's function *G* is updated iteratively, while *W* remains fixed at
          *W*₀. "G0W" – Only the screened interaction *W* is updated iteratively, while *G* remains fixed at
          *G*₀. "evGW" – Eigenvalue-only self-consistent GW; the quasiparticle energies are updated iteratively
          in both *G* and *W*, while the wavefunctions are kept from the starting point. "scGW" – Fully
          self-consistent GW; both *G* and *W* are updated iteratively until the quasiparticle energies and
          wavefunctions converge. "QSGW" – Quasiparticle self-consistent GW; the starting potential is updated to
          provide the optimal independent particle basis for the GW expansion.
      repeatable: false
      notes:
      - 'Note: Give it when `type` is GW or GW/BSE.'
    - name: bse-self-consistency
      required: false
      description: >-
        Specifies the level of iterative updating applied to the excitonic Hamiltonian in the BSE calculation.
        This property identifies whether the BSE is solved in a 'one-shot' manner or through an iterative cycle
        where the excitonic states are updated to reach a self-consistent solution.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [BSE0, scBSE]
        note: >-
          "BSE0" – One-shot BSE (BSE₀); the excitonic Hamiltonian is built once using fixed quasiparticle
          energies and screening (*W*). "scBSE" – Self-consistent BSE; internal refinement of the kernel or
          energies within the BSE process.
      repeatable: false
      notes:
      - 'Note: Give it when `type` is BSE or GW/BSE.'
  - name: dielectric-matrix
    required: true
    description: >-
      Information on the dielectric matrix used to compute the screened Coulomb interaction *W*.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    subproperties:
    - name: planewave-basis-cutoff
      required: false
      description: >-
        For a planewave code, the basis set cutoff employed for the dielectric matrix. It is set separately
        from the cutoff of the wave functions (dft kinetic-energy-cutoff) and is usually lower.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      notes:
      - >-
        Note: Specify either "planewave-basis-cutoff" or "localized-orbital-basis-set", but not both.
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: Energy
        recommended-unit: eV
        values:
          minimum: 0
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: localized-orbital-basis-set
      required: false
      description: For local orbital codes, the name of the basis set.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        examples: [cc-pV6Z]
      repeatable: false
      notes:
      - >-
        Note: Specify either "planewave-basis-cutoff" or "localized-orbital-basis-set", but not both.
    - name: frequency
      required: false
      description: >-
        The method used to handle the frequency dependence of the Green's function, the screened Coulomb
        interaction, and their product.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Hybertsen-Louie, Godby-Needs, Full frequency real axis, Full frequency imaginary axis, Contour
            deformation, Spacetime]
        note: >-
          "Hybertsen-Louie" – Generalized plasmon-pole model fitted to the static dielectric matrix and the
          f-sum rule. "Godby-Needs" – Plasmon-pole model fitted to the dielectric matrix at zero frequency and
          at one imaginary frequency. "Full frequency real axis" – The dielectric matrix is computed on a grid
          of real frequencies and the frequency integral evaluated on the real axis. "Full frequency imaginary
          axis" – The dielectric matrix is computed on the imaginary axis and the self-energy continued
          analytically to real frequencies. "Contour deformation" – The frequency integral is evaluated along
          the imaginary axis plus the residues of the poles it encloses. "Spacetime" – The Green's function
          and the screened interaction are computed in real space and imaginary time.
      repeatable: false
    - name: response-basis-size
      required: false
      description: >-
        For sum-over-states methods, the number of bands used in the sum. For linear-response methods, the
        number of dielectric eigenvalues.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
      repeatable: false
    - name: q-points
      required: true
      description: Brillouin zone grid used for sampling the dielectric matrix.
      type: int
      extent: [3]
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
        note: >-
          Ordered list of three integers, the number of points along the three reciprocal lattice vector
          directions.
      repeatable: false
    - name: coulomb-truncation
      required: false
      description: >-
        Method used to eliminate long-range Coulomb interactions between periodic replicas in supercell
        calculations.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Ismail-Beigi, Rozzi, Spencer-Alavi]
        note: >-
          "Ismail-Beigi" – Truncation for systems periodic in one or two dimensions (wires, slabs). "Rozzi" –
          Exact cutoff for systems periodic in zero, one or two dimensions (molecules, wires, slabs).
          "Spencer-Alavi" – Truncation of the Coulomb interaction beyond a sphere.
      repeatable: false
  - name: gw-bands
    required: false
    description: Number of bands for which the GW correction is evaluated.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    legacy_values: >-
      One integer specifying how many bands are corrected, counting from the bottom of the valence bands.
    legacy_unit: dimensionless
  - name: bse-hamiltonian
    required: false
    description: >-
      A collective descriptor for the parameters defining the construction, dimensionality, and solution
      method of the effective excitonic Bethe-Salpeter Hamiltonian that is being solved in a BSE calculation.
      It characterizes the Hilbert space size and the physical constraints (momentum and spin) applied during
      the diagonalization
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    legacy_values: Contains SubProperties as listed below.
    subproperties:
    - name: number-valence-bands
      required: false
      description: Number of valence bands included in the BSE Hamiltonian.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        One integer specifying how many valence bands are corrected, counting from the valence band top.
      legacy_unit: dimensionless
    - name: number-conduction-bands
      required: false
      description: Number of conduction bands included in the BSE Hamiltonian.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        One integer specifying how many bands are corrected, counting from the conduction band bottom.
      legacy_unit: dimensionless
    - name: k-point-mesh
      required: false
      description: Brillouin zone grid used for building the BSE Hamiltonian.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        Ordered list of 3 integer numbers containing the number points along the reciprocal lattice vector
        directions.
      legacy_unit: dimensionless
    - name: exciton-momentum
      required: false
      description: Crystal momentum of the exciton in the BSE calculation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        Ordered list of 3 real values containing the crystal momentum in fractions of the reciprocal
        lattice vectors (dimensionless), e.g. [0.5,0.5,1.0].
      legacy_unit: dimensionless
    - name: exciton-multiplicity
      required: false
      description: >-
        Specification whether the BSE calculation is performed for singlet or triplet excitons.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        string containing one of the values: "Singlet" "Triplet" Other user-specified value if none of the
        above apply.
    - name: diagonalization
      required: false
      description: Approximation method used to diagonalize the BSE Hamiltonian.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        String containing one of the following values: "Tamm-Dancoff" "Full diagonalization" Other user-specified
        value if none of the above apply.
    - name: number-lowest-eigenvalues
      required: false
      description: Number of lowest eigenvalues computed by solving the BSE Hamiltonian.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: One integer containing the number of BSE eigenvalues.
      legacy_unit: dimensionless
  - name: bse-kernel-truncation
    required: false
    description: >-
      Method used to eliminate long-range Coulomb interactions between periodic replicas in the BSE Coulomb
      kernel.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    legacy_values: >-
      String containing one of the following values: "Ismail-Beigi" "Rozzi" "Spencer-Alavi" Other user-specified
      value if none of the above apply.
