section: mbpt
title: 2.5 Many-Body Perturbation Theory (MBPT) Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The metadata for Many-Body Perturbation Theory (MBPT) data (MatCore-MBPT) is tabulated below. This includes the MBPT method, dielectric treatment, and associated parameters. The properties are given in settings blocks, each naming the MBPT computations it describes. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below. The DFT computation an MBPT computation starts from is described by MatCore-DFT and named in its `input` with the role Starting point.)
examples:
  - caption: MBPT Method-Specific Metadata
    file: mbpt.json
    source: https://archive.materialscloud.org/record/2023.92
legacy_complete: true
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: mbpt-method
    required: true
    description: The many-body perturbation theory (MBPT) approach used and associated settings.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    subproperties:
    - name: type
      required: true
      description: The nature of the MBPT calculation performed.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [GW, BSE, GW/BSE]
        note: |-
          - "GW" – A GW calculation of quasiparticle energies
          - "BSE" – A BSE calculation of neutral excitations from given quasiparticle energies, e.g. DFT energies with a scissor shift, the computation they come from named in minimal `computation › input` with the role Starting point
          - "GW/BSE" – A GW calculation followed by a BSE calculation using its results, described as one computation
      repeatable: false
    - name: gw-self-consistency
      required: false
      description: >-
        Specifies the level of iterative updating applied to the Green's function (*G*) and the screened Coulomb
        interaction (*W*) in the GW calculation. This property identifies whether the GW equations are solved in
        a 'one-shot' perturbative manner or through an iterative cycle where the quasiparticle states are updated
        to reach a self-consistent solution.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [G0W0, GW0, G0W, evGW, scGW, QSGW]
        note: |-
          - "G0W0" – One-shot calculation; *G*₀ and *W*₀ are constructed using the starting eigenvalues and wavefunctions
          - "GW0" – Only the Green's function *G* is updated iteratively, while *W* remains fixed at *W*₀
          - "G0W" – Only the screened interaction *W* is updated iteratively, while *G* remains fixed at *G*₀
          - "evGW" – Eigenvalue-only self-consistent GW; the quasiparticle energies are updated iteratively in both *G* and *W*, while the wavefunctions are kept from the starting point
          - "scGW" – Fully self-consistent GW; both *G* and *W* are updated iteratively until the quasiparticle energies and wavefunctions converge
          - "QSGW" – Quasiparticle self-consistent GW; the starting potential is updated to provide the optimal independent particle basis for the GW expansion
      repeatable: false
      notes:
      - 'Note: Give it when `type` is GW or GW/BSE.'
    - name: bse-self-consistency
      required: false
      description: >-
        Specifies the level of iterative updating applied to the excitonic Hamiltonian in the BSE calculation.
        This property identifies whether the BSE is solved in a 'one-shot' manner or through an iterative cycle
        where the excitonic states are updated to reach a self-consistent solution.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [BSE0, scBSE]
        note: |-
          - "BSE0" – One-shot BSE (BSE₀); the excitonic Hamiltonian is built once using fixed quasiparticle energies and screening (*W*)
          - "scBSE" – Self-consistent BSE; internal refinement of the kernel or energies within the BSE process
      repeatable: false
      notes:
      - 'Note: Give it when `type` is BSE or GW/BSE.'
  - name: dielectric-matrix
    required: true
    description: >-
      Information on the dielectric matrix used to compute the screened Coulomb interaction *W*.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    subproperties:
    - name: planewave-basis-cutoff
      required: false
      description: >-
        For a planewave code, the basis set cutoff employed for the dielectric matrix. It is set separately
        from the cutoff of the wave functions (dft kinetic-energy-cutoff) and is usually lower.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      notes:
      - >-
        Note: Specify either "planewave-basis-cutoff" or "atom-centered-basis-set", but not both.
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: Energy
        recommended-unit: eV
        values:
          minimum: 0
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: atom-centered-basis-set
      required: false
      description: For a code using basis functions centered on atoms, the name of the basis set.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        examples: [cc-pV6Z]
      repeatable: false
      notes:
      - >-
        Note: Specify either "planewave-basis-cutoff" or "atom-centered-basis-set", but not both.
    - name: frequency
      required: false
      description: >-
        The method used to handle the frequency dependence of the Green's function, the screened Coulomb
        interaction, and their product.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Hybertsen-Louie, Godby-Needs, Full frequency real axis, Full frequency imaginary axis, Contour
            deformation, Spacetime]
        note: |-
          - "Hybertsen-Louie" – Generalized plasmon-pole model fitted to the static dielectric matrix and the f-sum rule
          - "Godby-Needs" – Plasmon-pole model fitted to the dielectric matrix at zero frequency and at one imaginary frequency
          - "Full frequency real axis" – The dielectric matrix is computed on a grid of real frequencies and the frequency integral evaluated on the real axis
          - "Full frequency imaginary axis" – The dielectric matrix is computed on the imaginary axis and the self-energy continued analytically to real frequencies
          - "Contour deformation" – The frequency integral is evaluated along the imaginary axis plus the residues of the poles it encloses
          - "Spacetime" – The Green's function and the screened interaction are computed in real space and imaginary time
      repeatable: false
    - name: response-basis-size
      required: false
      description: >-
        For sum-over-states methods, the number of bands used in the sum. For linear-response methods, the
        number of dielectric eigenvalues.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
      repeatable: false
    - name: band-terminator
      required: false
      description: >-
        The method used to approximate the contribution of the bands left out of the sum over states of the
        polarizability.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [None, Bruneval-Gonze]
        note: |-
          - "None" – No correction; the sum stops at its last band
          - "Bruneval-Gonze" – The bands left out are replaced by one effective energy (the extrapolar approximation)
      repeatable: false
    - name: q-points
      required: true
      description: Brillouin zone grid used for sampling the dielectric matrix.
      type: int
      extent: [3]
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
        note: >-
          Ordered list of three integers, the number of points along the three reciprocal lattice vector
          directions.
      repeatable: false
    - name: coulomb-truncation
      required: false
      description: >-
        Method used to eliminate long-range Coulomb interactions between periodic replicas in supercell
        calculations.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Ismail-Beigi, Rozzi, Spencer-Alavi]
        note: |-
          - "Ismail-Beigi" – Truncation for systems periodic in one or two dimensions (wires, slabs)
          - "Rozzi" – Exact cutoff for systems periodic in zero, one or two dimensions (molecules, wires, slabs)
          - "Spencer-Alavi" – Truncation of the Coulomb interaction beyond a sphere
      repeatable: false
  - name: self-energy
    required: false
    description: The settings of the GW self-energy and the bands it corrects.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    notes:
    - 'Note: Give it when `type` is GW or GW/BSE.'
    subproperties:
    - name: band-range
      required: false
      description: >-
        The first and last band whose quasiparticle energies are computed. Bands are numbered from 1, the
        lowest band in the calculation.
      type: int
      extent: [2]
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
        examples: [[35, 70]]
      repeatable: false
    - name: number-of-bands
      required: false
      description: >-
        The number of bands in the sum over states of the self-energy, which runs over bands 1 to
        number-of-bands. It is at least the last band of band-range.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
      repeatable: false
    - name: band-terminator
      required: false
      description: >-
        The method used to approximate the contribution of the bands left out of the sum over states of the
        self-energy.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [None, Bruneval-Gonze]
        note: |-
          - "None" – No correction; the sum stops at its last band
          - "Bruneval-Gonze" – The bands left out are replaced by one effective energy (the extrapolar approximation)
      repeatable: false
  - name: bse-hamiltonian
    required: false
    description: >-
      A collective descriptor for the parameters defining the construction, dimensionality, and solution
      method of the effective excitonic Bethe-Salpeter Hamiltonian that is being solved in a BSE calculation.
      It characterizes the Hilbert space size and the physical constraints (momentum and spin) applied during
      the diagonalization.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    notes:
    - 'Note: Give it when `type` is BSE or GW/BSE.'
    subproperties:
    - name: number-valence-bands
      required: false
      description: Number of valence bands included in the BSE Hamiltonian.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
        note: Counted downward from the valence band top.
      repeatable: false
    - name: number-conduction-bands
      required: false
      description: Number of conduction bands included in the BSE Hamiltonian.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
        note: Counted upward from the conduction band bottom.
      repeatable: false
    - name: k-point-mesh
      required: false
      description: Brillouin zone grid used for building the BSE Hamiltonian.
      type: int
      extent: [3]
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
        note: >-
          The number of points along each reciprocal lattice vector of the cell in minimal `conditions ›
          cell`.
      repeatable: false
    - name: exciton-momentum
      required: false
      description: Crystal momentum of the exciton in the BSE calculation.
      type: float
      extent: [3]
      kind: dimensionless
      recommended-unit: null
      values:
        examples:
        - [0.5, 0.5, 1.0]
        note: >-
          The exciton's center-of-mass crystal momentum Q = Q₁b₁ + Q₂b₂ + Q₃b₃, where b₁, b₂, b₃ are the
          reciprocal lattice vectors of the cell in minimal `conditions › cell`; the value gives Q₁, Q₂, Q₃.
          [0, 0, 0] is the optical limit. Give the exciton's momentum, not an input shift that a code may
          define with the opposite sign.
      repeatable: false
    - name: exciton-multiplicity
      required: false
      description: >-
        Specification whether the BSE calculation is performed for singlet or triplet excitons.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Singlet, Triplet]
        note: |-
          - "Singlet" – Spin-singlet excitons; the kernel includes the exchange term
          - "Triplet" – Spin-triplet excitons; the exchange term vanishes
      repeatable: false
    - name: diagonalization
      required: false
      description: Approximation method used to diagonalize the BSE Hamiltonian.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Tamm-Dancoff, Full diagonalization]
        note: |-
          - "Tamm-Dancoff" – Only the resonant block of the Hamiltonian is kept; its coupling to the antiresonant block is neglected
          - "Full diagonalization" – The resonant and antiresonant blocks and the coupling between them are kept

          The term names the approximation, not the solver (direct or iterative).
      repeatable: false
    - name: number-lowest-eigenvalues
      required: false
      description: Number of lowest eigenvalues computed by solving the BSE Hamiltonian.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
      repeatable: false
  - name: bse-kernel-truncation
    required: false
    description: >-
      Method used to eliminate long-range Coulomb interactions between periodic replicas in the BSE Coulomb
      kernel.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Ismail-Beigi, Rozzi, Spencer-Alavi]
      note: |-
        - "Ismail-Beigi" – Truncation for systems periodic in one or two dimensions (wires, slabs)
        - "Rozzi" – Exact cutoff for systems periodic in zero, one or two dimensions (molecules, wires, slabs)
        - "Spencer-Alavi" – Truncation of the Coulomb interaction beyond a sphere
    repeatable: false
    notes:
    - 'Note: Give it when `type` is BSE or GW/BSE.'
