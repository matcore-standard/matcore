  notes:
  - 'Note: It is recommended to record the provenance of the dataset and to keep it current with each change.'
  subproperties:
  - name: event-type
    required: true
    description: Description of change made to the dataset.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Initial creation, Admin update, Version update, Metadata update]
      note: >-
        "Initial creation" – Initial creation of the dataset. "Admin update" – Editorial update to the
        dataset not requiring a version update (e.g. spelling correction). "Version update" – Change to
        the dataset or associated files requiring a new version. "Metadata update" – Change to the
        metadata, but not the dataset itself.
    repeatable: false
  - name: date
    required: true
    description: The date and time when the change was made.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
