section: minimal
title: 2.1 Minimal MatCore Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The minimal MatCore metadata includes aspects of a dataset deemed important to report for data findability and reuse and are *universal* across all computational methods. The list of minimal metadata is tabulated below.
examples:
  - caption: Minimal MatCore Metadata
    file: minimal.xml
    source: https://doi.org/10.60732/8e9bc5b0
    notes: >-
      The matcore-id format in the example is tentative and subject to change.
legacy_complete: true
properties:
- name: creator
  required: true
  description: >-
    A primary entity (e.g. person, organization, software agent) responsible for creating the dataset's core content and their institutional affiliation if relevant.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: name
    required: true
    description: The name of the entity that generated the dataset.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      examples: [Albert Einstein, Lawrence Livermore National Laboratory, Claude Opus 5.5]
    repeatable: false
  - name: identifier
    required: false
    description: >-
      A unique, persistent identifier that globally and unambiguously identifies the entity that created
      the dataset.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: value
      required: true
      description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: scheme
      required: true
      description: The identifier scheme that the value belongs to.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [ORCID, ROR, DOI, SWHID, ISNI]
        note: >-
          For individuals, an ORCID ID; for organizations, an ROR ID; for software or AI agents, a Digital
          Object Identifier (DOI) generated specifically for the software code or version (e.g., a Zenodo
          software DOI) or a Software Heritage ID (SWHID) pointing to the exact software release or state.
          An ISNI may identify either individuals or organizations.
      repeatable: false
  - name: affiliation
    required: false
    description: The affiliation of the entity that generated the dataset if they have one.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: name
      required: true
      description: The name of the affiliation.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: identifier
      required: false
      description: >-
        A unique, persistent identifier that globally and unambiguously identifies the affiliation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: scheme
        required: true
        description: The identifier scheme that the value belongs to.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [ROR, ISNI]
        repeatable: false
- name: contributor
  required: false
  description: >-
    An entity (e.g. person, organization, software agent) that provided secondary support, specialized skills, or resources to the dataset's development, but is not considered a primary author, and their institutional affiliation if relevant.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: name
    required: true
    description: The name of the entity that contributed to the dataset.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      examples: [Albert Einstein, Lawrence Livermore National Laboratory, Claude Opus 5.5]
    repeatable: false
  - name: identifier
    required: false
    description: >-
      A unique, persistent identifier that globally and unambiguously identifies the entity that
      contributed to the dataset.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: value
      required: true
      description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: scheme
      required: true
      description: The identifier scheme that the value belongs to.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [ORCID, ROR, DOI, SWHID, ISNI]
        note: >-
          For individuals, an ORCID ID; for organizations, an ROR ID; for software or AI agents, a Digital
          Object Identifier (DOI) generated specifically for the software code or version (e.g., a Zenodo
          software DOI) or a Software Heritage ID (SWHID) pointing to the exact software release or state.
          An ISNI may identify either individuals or organizations.
      repeatable: false
  - name: affiliation
    required: false
    description: The affiliation of the entity that contributed to the dataset if they have one.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: name
      required: true
      description: The name of the affiliation.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: identifier
      required: false
      description: >-
        A unique, persistent identifier that globally and unambiguously identifies the affiliation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: scheme
        required: true
        description: The identifier scheme that the value belongs to.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [ROR, ISNI]
        repeatable: false
- name: title
  required: true
  description: A single sentence description of the dataset.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values: null
  repeatable: false
- name: creation-date
  required: true
  description: The calendar date and time when the dataset was created.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values:
    pattern: '\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ)?'
    examples: ['2021-02-22', '2021-02-22T14:30:00Z']
    note: >-
      A date (YYYY-MM-DD), or a date and time in UTC (YYYY-MM-DDTHH:mm:ssZ), following the
      [ISO 8601 Date and Time Format Standard](https://www.iso.org/iso-8601-date-and-time-format.html).
  repeatable: false
- name: description
  required: true
  description: A synopsis of the dataset, its contents, and purpose.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values:
    note: >-
      This can optionally include information on the format in which the dataset is stored (e.g. pointer
      to a relevant schema).
  repeatable: false
- name: disclaimer
  required: false
  description: >-
    A statement of applicability provided by the creator(s) informing users of the intended use and/or
    limitations of this dataset.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values: null
  repeatable: false
- name: structure
  required: true
  description: >-
    A system modeled in the dataset, e.g. a bulk crystal or a thin film on a substrate, and the materials
    that make it up.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: description
    required: false
    description: >-
      An explanation of the structure as a whole, e.g. the stacking order of its layers, the number of periods
      of a superlattice, or how its components meet.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
  - name: material-component
    required: true
    description: >-
      One part of the structure, made of a single material, with its composition, form, role and phase.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: constituent
      required: true
      description: A chemical element included in the material component and its concentration.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      subproperties:
      - name: species
        required: true
        description: A chemical element included in the material.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          enum: [H, He, Li, Be, B, C, N, O, F, Ne, Na, Mg, Al, Si, P, S, Cl, Ar, K, Ca, Sc, Ti, V, Cr, Mn, Fe,
            Co, Ni, Cu, Zn, Ga, Ge, As, Se, Br, Kr, Rb, Sr, Y, Zr, Nb, Mo, Tc, Ru, Rh, Pd, Ag, Cd, In, Sn, Sb,
            Te, I, Xe, Cs, Ba, La, Ce, Pr, Nd, Pm, Sm, Eu, Gd, Tb, Dy, Ho, Er, Tm, Yb, Lu, Hf, Ta, W, Re, Os,
            Ir, Pt, Au, Hg, Tl, Pb, Bi, Po, At, Rn, Fr, Ra, Ac, Th, Pa, U, Np, Pu, Am, Cm, Bk, Cf, Es, Fm, Md,
            'No', Lr, Rf, Db, Sg, Bh, Hs, Mt, Ds, Rg, Cn, Nh, Fl, Mc, Lv, Ts, Og]
          examples: [C]
          note: >-
            The symbol of the element, as in the IUPAC Periodic Table of the Elements (listed with atomic
            numbers 1 to 118 in the [Standard Atomic Weights](https://www.ciaaw.org/atomic-weights.htm) table
            of the IUPAC Commission on Isotopic Abundances and Atomic Weights).
        repeatable: false
      - name: concentration
        required: true
        description: The atomic fraction of the material composed of this element.
        type: float
        extent: []
        kind: dimensionless
        recommended-unit: null
        values:
          minimum: 0
          maximum: 1
          note: The concentrations of a material component's constituents sum to 1.
        repeatable: false
    - name: form
      required: true
      description: The geometric form of the component as modeled.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [2D material, Bulk, Chain, Cluster, Molecule, Monolayer, Nanoparticle, Nanoribbon, Nanotube,
          Nanowire, Slab, Thin film]
        note: >-
          One of: "2D material" – A crystalline solid that is a single unit cell thick (typically a few
          nanometers or less), while extending infinitely or to large dimensions in the lateral plane, e.g.
          graphene. "Bulk" – A material extending without bound in all three directions, e.g. a periodic
          crystal or a liquid. "Chain" – A one-dimensional sequence of atoms or monomers, e.g. an isolated
          polymer chain or a monatomic chain. "Cluster" – A finite aggregate of atoms or molecules, smaller
          than a nanoparticle. "Molecule" – A single molecule. "Monolayer" – A single layer of atoms or
          molecules deposited on another material. "Nanoparticle" – A solid particle of nanometer size in all
          three directions. "Nanoribbon" – A strip of a 2D material of nanometer width. "Nanotube" – A hollow cylinder of nanometer diameter, e.g. a carbon
          nanotube. "Nanowire" – A solid wire of nanometer diameter, extending without bound along its axis.
          "Slab" – A truncated bulk structure that can be used, for example, to model surfaces. "Thin film" –
          A layer of finite thickness, free-standing or on a substrate. The form is that of the component as
          modeled, e.g. a substrate modeled as a slab is a Slab.
      repeatable: false
    - name: role
      required: false
      description: The part the component plays in the structure.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Adsorbate, Core, Film, Inclusion, Layer, Matrix, Shell, Solute, Solvent, Substrate]
        note: >-
          One of: "Adsorbate" – A molecule, cluster or particle on the surface of a substrate. "Core" – The
          inner part of a particle, enclosed by a shell. "Film" – A layer of finite thickness on a substrate.
          "Inclusion" – A material enclosed in a matrix, e.g. a precipitate or an embedded nanotube. "Layer" –
          One of the layers of a layered structure, e.g. a heterostructure, a superlattice or a stack of 2D
          materials. "Matrix" – A material that encloses one or more inclusions. "Shell" – A layer enclosing a
          core. "Solute" – A material dissolved in a solvent. "Solvent" – A liquid in which a solute is
          dissolved. "Substrate" – A material on which a film, layer or adsorbate lies. Give a role for each
          component when the structure has more than one.
      repeatable: false
    - name: fraction
      required: false
      description: The atomic fraction of the structure made up of this component, i.e. the number of atoms in the component divided by the number of atoms in the structure.
      type: float
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 0
        maximum: 1
        note: The fractions of a structure's components sum to 1.
      repeatable: false
    - name: phase
      required: false
      description: A phase of the material.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Amorphous, Single crystal, Polycrystal, Quasicrystal, Liquid, Gas, Plasma]
        note: >-
          One of: "Amorphous" – A solid material without crystalline order. "Single crystal" – A solid
          material characterized by a repeating pattern of atoms that extends throughout it without
          interruption. "Polycrystal" – A solid material made of more than one crystalline grain of differing orientation. "Quasicrystal" – A crystal-like material with short-range order, but without
          long-range order. "Liquid" – A fluid structure (e.g. the molten state of a material). "Gas" – A
          state where molecules or atoms are far apart and only interact during collisions. "Plasma" – A
          gas comprised of ions and electrons. Omit for a component whose form is Molecule.
      repeatable: true
    - name: description
      required: false
      description: >-
        An explanation of the nature of the material, e.g. a crystal structure designation, a chemical formula
        for a molecule, etc.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          e.g. a surface facet such as Pt(111), an orientation relationship such as (111)Pt ∥ (001)CeO₂, or the
          chirality of a nanotube.
      repeatable: false
    - name: microstructure
      required: false
      description: >-
        For a solid state phase, a description of the arrangement of phases, grains and defects in the
        material.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
- name: computation
  required: true
  description: A description of a computer simulation used to generate data in the dataset.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: method-class
    required: true
    description: The general category to which the computational technique belongs.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Electronic, Atomistic, Mesoscopic, Continuum, Data-driven]
    repeatable: false
    notes:
    - >-
      Note: The categories listed above are based on the [MODA
      standard](https://data.europa.eu/doi/10.2777/404734).
  - name: method
    required: true
    description: The computational materials science (CMS) approach used in the computation.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      depends-on: method-class
      cases:
        Electronic: {terms: [CC, QMC, DFT, MBPT]}
        Atomistic: {terms: [MC, MD]}
        Mesoscopic: {terms: [DDD, KMC, CGMD]}
        Continuum: {terms: [PF]}
        Data-driven: {terms: [ML]}
      note: >-
        "CC" – Coupled Cluster; "QMC" – Quantum Monte Carlo; "DFT" – Density Functional Theory; "MBPT" –
        Many-Body Perturbation Theory methods (such as GW and BSE); "MC" – Monte Carlo; "MD" – Molecular
        Dynamics; "DDD" – Discrete Dislocation Dynamics; "KMC" – Kinetic Monte Carlo; "CGMD" –
        Coarse-grained MD; "PF" – Phase Field; "ML" – Machine Learning.
    repeatable: false
  - name: simulation-conditions
    required: true
    description: >-
      The interactions between the system being modeled and the rest of the world maintained during the
      computation.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    notes:
    - >-
      Note: The SubSubProperties listed below (aside from type and description) are provided as
      appropriate given the nature of the simulation. Providing a SubSubProperty means that its value is
      imposed on the simulation as an external constraint.
    subproperties:
    - name: type
      required: true
      description: >-
        The nature of the simulation being performed, whether equilibrium, nonequilibrium, or
        nonstandard.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Equilibrium, Nonequilibrium, Other]
        note: >-
          "Equilibrium" – Thermodynamic equilibrium. "Nonequilibrium" – Conforming to some definition of
          nonequilibrium thermodynamics. "Other" – A simulation not fitting into the equilibrium and
          nonequilibrium categories.
      repeatable: false
    - name: description
      required: false
      description: Explanatory text clarifying the simulation type selection.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: number-of-particles
      required: false
      description: A count of atoms or other discrete entities comprising the material.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        note: >-
          The number of particles <i>N</i>.
      repeatable: false
    - name: volume
      required: false
      description: The amount of space occupied by the material.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: Volume
        recommended-unit: angstrom^3
        values:
          note: >-
            The volume <i>V</i>.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: mass-density
      required: false
      description: The total mass of the material divided by the volume it occupies.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: MassDensity
        recommended-unit: kg/m^3
        values:
          note: >-
            The mass density <i>ρ</i>.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: number-density
      required: false
      description: The total number of particles comprising the material divided by the volume it occupies.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: NumberDensity
        recommended-unit: 1/angstrom^3
        values:
          note: >-
            The number density <i>n</i>.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: cell
      required: false
      description: The domain occupied by the material in the simulation (if fixed).
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: [3, 3]
        kind: Length
        recommended-unit: angstrom
        values:
          note: >-
            Ordered list of three vectors (a, b, c), each with three components, that define the
            simulation cell. The vectors (a, b, c) need not be orthogonal, and the magnitudes (|a|, |b|,
            |c|) are the supercell vector lengths. The unit applies to all nine components.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: cell-reference
      required: false
      description: >-
        The domain occupied by the material in the simulation in configuration relative to which strains
        are defined.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: [3, 3]
        kind: Length
        recommended-unit: angstrom
        values:
          note: >-
            Ordered list of three vectors (a<sub>0</sub>, b<sub>0</sub>, c<sub>0</sub>), each with three
            components, that define the cell used in the simulation in its reference configuration. The
            vectors (a<sub>0</sub>, b<sub>0</sub>, c<sub>0</sub>) need not be orthogonal, and the
            magnitudes (|a<sub>0</sub>|, |b<sub>0</sub>|, |c<sub>0</sub>|) are the reference cell vector
            lengths. The unit applies to all nine components.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: cell-periodicity
      required: false
      description: >-
        Specification of whether periodic boundary conditions are applied along the cell vector
        directions. This applies to both cell and cell-reference.
      type: bool
      extent: [3]
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          Ordered list of three booleans (<i>p</i><sub>a</sub>, <i>p</i><sub>b</sub>,
          <i>p</i><sub>c</sub>), which are set to true if periodic boundary conditions are applied along
          the corresponding cell vectors (a, b, c).
      repeatable: false
    - name: temperature
      required: false
      description: >-
        A measure of the hotness or coldness of an external heat bath in thermal contact with the
        material.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: Temperature
        recommended-unit: K
        values:
          note: >-
            The temperature <i>T</i>.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: stress
      required: false
      description: >-
        A uniform force per unit current area, including both normal and shear components, applied to
        the material during the simulation through contact with an external loading device.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      notes:
      - >-
        Note 1: Requires the definition of the cell subproperty in order for a basis to be defined
        relative to which the tensor components are given.
      - >-
        Note 2: The adopted sign convention is for tensile normal stresses to be positive, and
        compressive normal stresses to be negative. This implies that for a material subjected to a
        positive pressure <i>p</i>, the stress tensor components are [-<i>p</i>, -<i>p</i>, -<i>p</i>,
        0, 0, 0].
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: [6]
        kind: Pressure
        recommended-unit: GPa
        values:
          note: >-
            The components of the (symmetric) Cauchy stress tensor <i>σ</i> in the following order:
            [<i>σ</i><sub>11</sub>, <i>σ</i><sub>22</sub>, <i>σ</i><sub>33</sub>, <i>σ</i><sub>23</sub>,
            <i>σ</i><sub>13</sub>, <i>σ</i><sub>12</sub>]. The stress components are expressed relative
            to an orthonormal basis (e<sub>1</sub>, e<sub>2</sub>, e<sub>3</sub>), where e<sub>1</sub>
            is in the direction of a, e<sub>2</sub> is in the direction of c╳a, and e<sub>3</sub> =
            e<sub>1</sub>╳e<sub>2</sub>, where (a, b, c) are the vectors defining the cell, which may
            not be orthogonal. The unit applies to all six components.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: strain
      required: false
      description: >-
        A deformation relative to a reference configuration imposed on the simulation cell expressed in
        the referential frame (Lagrangian strain tensor).
      type: float
      extent: [6]
      kind: dimensionless
      recommended-unit: null
      values:
        note: >-
          The components of the (symmetric) Lagrangian strain tensor <i>E</i> in the following order:
          [<i>E</i><sub>11</sub>, <i>E</i><sub>22</sub>, <i>E</i><sub>33</sub>, <i>E</i><sub>23</sub>,
          <i>E</i><sub>13</sub>, <i>E</i><sub>12</sub>]. The strain components are expressed relative
          to an orthonormal basis (e<sub>1</sub>, e<sub>2</sub>, e<sub>3</sub>), where e<sub>1</sub>
          is in the direction of a<sub>0</sub>, e<sub>2</sub> is in the direction of
          c<sub>0</sub>╳a<sub>0</sub>, and e<sub>3</sub> = e<sub>1</sub>╳e<sub>2</sub>, where
          (a<sub>0</sub>, b<sub>0</sub>, c<sub>0</sub>) are the vectors defining the cell in the
          reference configuration, which may not be orthogonal.
      repeatable: false
      notes:
      - >-
        Note: Requires the definition of cell-reference in order for the basis to be defined relative to
        which the tensor components are given.
    - name: strain-rate
      required: false
      description: >-
        The derivative with respect to time of a deformation relative to a reference configuration
        imposed on the simulation cell expressed in the referential frame (Lagrangian strain rate
        tensor), which is constant throughout the simulation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      notes:
      - >-
        Requires the definition of cell-reference in order for the basis to be defined relative to which
        the tensor components are given
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: [6]
        kind: InverseTime
        recommended-unit: 1/s
        values:
          note: >-
            The components of the (symmetric) Lagrangian strain rate tensor <i>Ė</i> in the following
            order: [<i>Ė</i><sub>11</sub>, <i>Ė</i><sub>22</sub>, <i>Ė</i><sub>33</sub>,
            <i>Ė</i><sub>23</sub>, <i>Ė</i><sub>13</sub>, <i>Ė</i><sub>12</sub>]. The strain rate
            components are expressed relative to an orthonormal basis (e<sub>1</sub>, e<sub>2</sub>,
            e<sub>3</sub>), where e<sub>1</sub> is in the direction of a<sub>0</sub>, e<sub>2</sub> is
            in the direction of c<sub>0</sub>╳a<sub>0</sub>, and e<sub>3</sub> =
            e<sub>1</sub>╳e<sub>2</sub>, where (a<sub>0</sub>, b<sub>0</sub>, c<sub>0</sub>) are the
            vectors defining the cell in the reference configuration, which may not be orthogonal.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: heat-flux
      required: false
      description: >-
        The amount of thermal energy transferred to the material per unit area per unit time along a
        given direction.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: [3]
        kind: HeatFluxDensity
        recommended-unit: W/m^2
        values:
          note: >-
            The components of the heat flux vector q. The heat flux components are expressed relative to
            an orthonormal basis (e<sub>1</sub>, e<sub>2</sub>, e<sub>3</sub>), where e<sub>1</sub> is
            in the direction of a, e<sub>2</sub> is in the direction of c╳a, and e<sub>3</sub> =
            e<sub>1</sub>╳e<sub>2</sub>, where (a, b, c) are the vectors defining the cell, which may
            not be orthogonal.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: temperature-gradient
      required: false
      description: >-
        A physical quantity that describes the rate and direction of maximum temperature change per unit
        distance.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: [3]
        kind: TemperatureGradient
        recommended-unit: K/m
        values:
          note: >-
            The components of the temperature gradient vector ∇<i>T</i>. The temperature gradient
            components are expressed relative to an orthonormal basis (e<sub>1</sub>, e<sub>2</sub>,
            e<sub>3</sub>), where e<sub>1</sub> is in the direction of a, e<sub>2</sub> is in the
            direction of c╳a, and e<sub>3</sub> = e<sub>1</sub>╳e<sub>2</sub>, where (a, b, c) are the
            vectors defining the cell, which may not be orthogonal.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
