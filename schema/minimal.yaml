        required: true
        description: The value of the property.
        type: float
        extent: [6]
        kind: dimensionless
        recommended-unit: null
        values:
          note: >-
            The components of the (symmetric) Lagrangian strain tensor <i>E</i> in the following order:
            [<i>E</i><sub>11</sub>, <i>E</i><sub>22</sub>, <i>E</i><sub>33</sub>, <i>E</i><sub>23</sub>,
            <i>E</i><sub>13</sub>, <i>E</i><sub>12</sub>]. The strain components are expressed relative
            to an orthonormal basis (e<sub>1</sub>, e<sub>2</sub>, e<sub>3</sub>), where e<sub>1</sub>
            is in the direction of a<sub>0</sub>, e<sub>2</sub> is in the direction of
            c<sub>0</sub>╳a<sub>0</sub>, and e<sub>3</sub> = e<sub>1</sub>╳e<sub>2</sub>, where
