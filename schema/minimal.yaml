- name: publication
  required: false
  description: >-
    A publication that describes the dataset or the work that produced it, e.g. a journal article or
    preprint, to be cited when the dataset is used.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  notes:
  - 'Note: The location where the dataset itself is stored is given in `dataset-location`.'
  subproperties:
  - name: reference
    required: true
    description: Text that uniquely identifies the source of information being cited.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
  - name: doi
    required: false
    description: The digital object identifier (DOI) for the source.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      pattern: 'https://doi\.org/10\.[^/]+/.+'
      examples: ['https://doi.org/10.1000/182']
    repeatable: false
  - name: link
    required: false
    description: A URI pointing to a permanent location of the source.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      format: uri
      examples: ['https://arxiv.org/abs/1805.01568']
    repeatable: false
- name: dataset-location
  required: false
  description: A repository where the dataset itself is stored and can be obtained.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  notes:
