section: minimal
title: 2.1 Minimal MatCore Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The minimal MatCore metadata includes aspects of a dataset deemed important to report for data findability and reuse and are *universal* across all computational methods. The list of minimal metadata is tabulated below.
examples:
  - caption: Minimal MatCore Metadata
    file: minimal.json
    source: https://doi.org/10.60732/8e9bc5b0
    notes: >-
      The form of the id in the example's matcore is tentative and subject to change.
legacy_complete: true
properties:
- name: creator
  required: true
  description: >-
    A primary entity (e.g. person, organization, software agent) responsible for creating the dataset's core content and their institutional affiliation if relevant.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: name
    required: true
    description: The name of the entity that generated the dataset.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      examples: [Albert Einstein, Lawrence Livermore National Laboratory, Claude Opus 5.5]
    repeatable: false
  - name: identifier
    required: false
    description: >-
      A unique, persistent identifier that globally and unambiguously identifies the entity that created
      the dataset.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: value
      required: true
      description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: scheme
      required: true
      description: The identifier scheme that the value belongs to.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [ORCID, ROR, DOI, SWHID, ISNI]
        note: >-
          For individuals, an ORCID ID; for organizations, an ROR ID; for software or AI agents, a Digital
          Object Identifier (DOI) generated specifically for the software code or version (e.g., a Zenodo
          software DOI) or a Software Heritage ID (SWHID) pointing to the exact software release or state.
          An ISNI may identify either individuals or organizations.
      repeatable: false
  - name: affiliation
    required: false
    description: The affiliation of the entity that generated the dataset if they have one.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: name
      required: true
      description: The name of the affiliation.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: identifier
      required: false
      description: >-
        A unique, persistent identifier that globally and unambiguously identifies the affiliation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: scheme
        required: true
        description: The identifier scheme that the value belongs to.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [ROR, ISNI]
        repeatable: false
- name: contributor
  required: false
  description: >-
    An entity (e.g. person, organization, software agent) that provided secondary support, specialized skills, or resources to the dataset's development, but is not considered a primary author, and their institutional affiliation if relevant.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: name
    required: true
    description: The name of the entity that contributed to the dataset.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      examples: [Albert Einstein, Lawrence Livermore National Laboratory, Claude Opus 5.5]
    repeatable: false
  - name: identifier
    required: false
    description: >-
      A unique, persistent identifier that globally and unambiguously identifies the entity that
      contributed to the dataset.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: value
      required: true
      description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: scheme
      required: true
      description: The identifier scheme that the value belongs to.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [ORCID, ROR, DOI, SWHID, ISNI]
        note: >-
          For individuals, an ORCID ID; for organizations, an ROR ID; for software or AI agents, a Digital
          Object Identifier (DOI) generated specifically for the software code or version (e.g., a Zenodo
          software DOI) or a Software Heritage ID (SWHID) pointing to the exact software release or state.
          An ISNI may identify either individuals or organizations.
      repeatable: false
  - name: affiliation
    required: false
    description: The affiliation of the entity that contributed to the dataset if they have one.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: name
      required: true
      description: The name of the affiliation.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: identifier
      required: false
      description: >-
        A unique, persistent identifier that globally and unambiguously identifies the affiliation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: scheme
        required: true
        description: The identifier scheme that the value belongs to.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [ROR, ISNI]
        repeatable: false
- name: title
  required: true
  description: A single sentence description of the dataset.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values: null
  repeatable: false
- name: creation-date
  required: true
  description: The calendar date and time when the dataset was created.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values:
    pattern: '\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ)?'
    examples: ['2021-02-22', '2021-02-22T14:30:00Z']
    note: >-
      A date (YYYY-MM-DD), or a date and time in UTC (YYYY-MM-DDTHH:mm:ssZ), following the
      [ISO 8601 Date and Time Format Standard](https://www.iso.org/iso-8601-date-and-time-format.html).
  repeatable: false
- name: description
  required: true
  description: A synopsis of the dataset, its contents, and purpose.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values:
    note: >-
      This can optionally include information on the format in which the dataset is stored (e.g. pointer
      to a relevant schema).
  repeatable: false
- name: disclaimer
  required: false
  description: >-
    A statement of applicability provided by the creator(s) informing users of the intended use and/or
    limitations of this dataset.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values: null
  repeatable: false
- name: structure
  required: true
  description: >-
    A system modeled in the dataset, e.g. a bulk crystal or a thin film on a substrate, and the materials
    that make it up.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: label
    required: true
    description: A name for this structure, by which computations in the record refer to it.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
      examples: [si-bulk]
    repeatable: false
    notes:
    - 'Note: A label is unique among all labels of structures and computations in the record.'
  - name: description
    required: false
    description: >-
      An explanation of the structure as a whole, e.g. the stacking order of its layers, the number of periods
      of a superlattice, or how its components meet.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
  - name: material-component
    required: true
    description: >-
      One part of the structure, made of a single material, with its composition, form, role and phase.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: formula
      required: true
      description: The chemical formula of the material component.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        pattern: "[A-Za-z0-9.(){}+-]+"
        examples: [Si, SiO2, H2O2, Si0.7Ge0.3, 'Si{x}Ge{1-x}', '(H2O)0.9(C2H6O)0.1', Ja0.8Jb0.2]
        note: >-
          A formula is a sequence of terms. A term is an element symbol, a user-defined species or a group in
          parentheses, each followed by an optional count. An element symbol is one of the 118 symbols of the
          IUPAC Periodic Table of the Elements (listed with atomic numbers 1 to 118 in the [Standard Atomic
          Weights](https://www.ciaaw.org/atomic-weights.htm) table of the IUPAC Commission on Isotopic
          Abundances and Atomic Weights). A user-defined species, for particles that are not chemical
          elements (e.g. in a Lennard-Jones model), is `J` followed by lowercase letters (e.g. `Ja`, `Jlj`);
          no element symbol begins with J. A count is a positive number, whole or decimal (e.g. `H2O`,
          `Si0.7Ge0.3`), or an expression in braces (e.g. `Si{x}Ge{1-x}`). A count of 1 is omitted. An
          expression contains at least one variable, given in `variable`, and is linear in its variables; it
          is built from numbers, one-letter variables, `+`, `-`, implied multiplication and parentheses (e.g.
          `1-x`, `3x`, `2(1-x)`). A variable is used only when the composition varies, so a fixed composition
          is written with its numbers (e.g. `Si0.3Ge0.7`). A formula that is a sequence of two or more groups
          is a mixture of substances: the groups' counts are their mole fractions and sum to 1 (e.g.
          `(H2O)0.9(C2H6O)0.1`). Elements may appear in any order. A molecule is written with its molecular
          formula (e.g. `H2O2`, not `HO`). Separate phases, e.g. a film on a substrate, are separate material
          components.
      repeatable: false
    - name: variable
      required: false
      description: A value of a variable used in `formula`.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      subproperties:
      - name: name
        required: true
        description: The name of the variable, as written in `formula`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          pattern: "[a-z]"
          examples: [x]
        repeatable: false
      - name: value
        required: true
        description: A value of the variable.
        type: float
        extent: []
        kind: dimensionless
        recommended-unit: null
        values: null
        repeatable: false
      - name: qualifier
        required: true
        description: What the value represents.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Average, Final, Initial, Maximum, Minimum]
          note: >-
            The entries of one variable share its name, with at most one entry per qualifier.
        repeatable: false
    - name: topology
      required: false
      description: >-
        The structure of a substance in the material component, given by an identifier, when its formula
        alone does not determine it.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: Give topology only when the formula matches more than one isomer or polymorph and the data must
        say which, e.g. ethanol and dimethyl ether (C2H6O), or calcite and aragonite (CaCO3).
      subproperties:
      - name: substance
        required: true
        description: >-
          The formula of the substance, either a group in the material component's formula or the whole
          formula.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          examples: [C2H6O]
        repeatable: false
      - name: identifier
        required: true
        description: An identifier of the substance's structure.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: true
        subproperties:
        - name: value
          required: true
          description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            examples: ['InChI=1S/C2H6O/c1-2-3/h3H,2H2,1H3', CCO, ABC3_oP20_62_c_c_cd]
          repeatable: false
        - name: scheme
          required: true
          description: The identifier scheme that the value belongs to.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            terms: [AFLOW, InChI, SMILES]
            note: >-
              For a molecule, InChI is preferred where it can represent it; SMILES otherwise or in addition. For
              a crystal, the AFLOW prototype label.
          repeatable: false
    - name: form
      required: true
      description: The geometric form of the component as modeled.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [2D material, Bulk, Chain, Cluster, Molecule, Monolayer, Nanoparticle, Nanoribbon, Nanotube,
          Nanowire, Slab, Thin film]
        note: >-
          One of: "2D material" – A crystalline solid that is a single unit cell thick (typically a few
          nanometers or less), while extending infinitely or to large dimensions in the lateral plane, e.g.
          graphene. "Bulk" – A material extending without bound in all three directions, e.g. a periodic
          crystal or a liquid. "Chain" – A one-dimensional sequence of atoms or monomers, e.g. an isolated
          polymer chain or a monatomic chain. "Cluster" – A finite aggregate of atoms or molecules, smaller
          than a nanoparticle. "Molecule" – A single molecule. "Monolayer" – A single layer of atoms or
          molecules deposited on another material. "Nanoparticle" – A solid particle of nanometer size in all
          three directions. "Nanoribbon" – A strip of a 2D material of nanometer width. "Nanotube" – A hollow cylinder of nanometer diameter, e.g. a carbon
          nanotube. "Nanowire" – A solid wire of nanometer diameter, extending without bound along its axis.
          "Slab" – A truncated bulk structure that can be used, for example, to model surfaces. "Thin film" –
          A layer of finite thickness, free-standing or on a substrate. The form is that of the component as
          modeled, e.g. a substrate modeled as a slab is a Slab.
      repeatable: false
    - name: role
      required: false
      description: The part the component plays in the structure.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Adsorbate, Core, Film, Inclusion, Layer, Matrix, Shell, Solute, Solvent, Substrate]
        note: >-
          One of: "Adsorbate" – A molecule, cluster or particle on the surface of a substrate. "Core" – The
          inner part of a particle, enclosed by a shell. "Film" – A layer of finite thickness on a substrate.
          "Inclusion" – A material enclosed in a matrix, e.g. a precipitate or an embedded nanotube. "Layer" –
          One of the layers of a layered structure, e.g. a heterostructure, a superlattice or a stack of 2D
          materials. "Matrix" – A material that encloses one or more inclusions. "Shell" – A layer enclosing a
          core. "Solute" – A material dissolved in a solvent. "Solvent" – A liquid in which a solute is
          dissolved. "Substrate" – A material on which a film, layer or adsorbate lies. Give a role for each
          component when the structure has more than one.
      repeatable: false
    - name: fraction
      required: false
      description: The atomic fraction of the structure made up of this component, i.e. the number of atoms in the component divided by the number of atoms in the structure.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      subproperties:
      - name: value
        required: true
        description: The value of the property.
        type: float
        extent: []
        kind: dimensionless
        recommended-unit: null
        values:
          minimum: 0
          maximum: 1
          note: >-
            The fractions of a structure's components sum to 1, for the entries without a qualifier and for
            each of Initial, Final and Average.
        repeatable: false
      - name: qualifier
        required: false
        description: What the value represents.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Average, Final, Initial, Maximum, Minimum]
          note: >-
            Without a qualifier, the value holds throughout the simulation and across the system, and the entry
            is the only one for the condition. Otherwise give one entry for each qualifier that applies, e.g.
            Initial and Final for a ramp, Minimum and Maximum for a range. For a vector or tensor, Minimum and
            Maximum are taken component by component.
        repeatable: false
    - name: phase
      required: false
      description: A phase of the material.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Amorphous, Single crystal, Polycrystal, Quasicrystal, Liquid, Gas, Plasma]
        note: >-
          One of: "Amorphous" – A solid material without crystalline order. "Single crystal" – A solid
          material characterized by a repeating pattern of atoms that extends throughout it without
          interruption. "Polycrystal" – A solid material made of more than one crystalline grain of differing
          orientation. "Quasicrystal" – A solid material with long-range order but without translational
          periodicity, e.g. one whose diffraction pattern shows five-fold rotational symmetry. "Liquid" – A fluid structure (e.g. the molten state of a material). "Gas" – A
          state where molecules or atoms are far apart and only interact during collisions. "Plasma" – A
          gas comprised of ions and electrons. Omit for a component whose form is Molecule.
      repeatable: true
    - name: magnetic-order
      required: false
      description: The arrangement of the magnetic moments in the material component as modeled.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Nonmagnetic, Ferromagnetic, Antiferromagnetic, Ferrimagnetic, Paramagnetic, Noncollinear]
        note: >-
          "Nonmagnetic" – No magnetic moments. "Ferromagnetic" – Moments aligned parallel.
          "Antiferromagnetic" – Equal moments aligned antiparallel, with no net moment. "Ferrimagnetic" –
          Unequal moments aligned antiparallel, with a net moment. "Paramagnetic" – Moments present but
          disordered, e.g. modeled as disordered local moments. "Noncollinear" – Moments not along one axis,
          e.g. a spin spiral.
      repeatable: false
    - name: description
      required: false
      description: >-
        An explanation of the nature of the material, e.g. a crystal structure designation, a chemical formula
        for a molecule, etc.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          e.g. a surface facet such as Pt(111), an orientation relationship such as (111)Pt ∥ (001)CeO₂, or the
          chirality of a nanotube.
      repeatable: false
    - name: microstructure
      required: false
      description: >-
        For a solid state phase, a description of the arrangement of phases, grains and defects in the
        material.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
- name: computation
  required: true
  description: >-
    A group of calculations in the dataset that share one method and one set of settings, e.g. the DFT single
    points of a training set.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: label
    required: true
    description: >-
      A name for this computation, by which other computations and the method-specific sections refer to
      it.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
      examples: [dft-single-points]
    repeatable: false
    notes:
    - 'Note: A label is unique among all labels of structures and computations in the record.'
  - name: method-class
    required: true
    description: The general category to which the computational technique belongs.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Electronic, Atomistic, Mesoscopic, Continuum, Data-driven]
    repeatable: false
    notes:
    - >-
      Note: The categories listed above are based on the [MODA
      standard](https://data.europa.eu/doi/10.2777/404734).
  - name: method
    required: true
    description: The computational materials science (CMS) approach used in the computation.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      depends-on: method-class
      cases:
        Electronic: {terms: [CC, QMC, DFT, MBPT, TB]}
        Atomistic: {terms: [MC, MD, MS, PIM]}
        Mesoscopic: {terms: [DDD, KMC, CGMD, PIM]}
        Continuum: {terms: [PF]}
        Data-driven: {terms: [ML]}
      note: >-
        "CC" – Coupled Cluster; "QMC" – Quantum Monte Carlo; "DFT" – Density Functional Theory; "MBPT" –
        Many-Body Perturbation Theory methods (such as GW and BSE); "TB" – Tight Binding; "MC" – Monte Carlo;
        "MD" – Molecular Dynamics; "MS" – Molecular Statics: configurations or cells of particles relaxed
        toward a minimum of the energy, using the energies and forces of an interaction model; "PIM" –
        Particle Interaction Model: energies and forces of a system of particles given as an explicit function
        of the particles' coordinates, which may include electrons treated as particles, without solving for a
        wavefunction or an electron density, e.g. an interatomic potential, a machine-learned interatomic
        potential, a bonded force field, a coarse-grained model or the electron force field; "DDD" – Discrete
        Dislocation Dynamics; "KMC" – Kinetic Monte Carlo; "CGMD" – Coarse-grained MD; "PF" – Phase Field;
        "ML" – Machine Learning.
    repeatable: false
    notes:
    - >-
      Note: Give the method of the calculations in this computation. When they use energies and forces from
      another method, describe that method as a computation of its own and name it in `input` with the role
      Interaction model.
  - name: task
    required: true
    description: What the calculations of this computation do.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Single point, Optimization, Dynamics, Sampling, Free energy calculation, Training, Property
          calculation]
      note: >-
        "Single point" – Energies, forces or other quantities evaluated for given configurations, without
        moving them, including the evaluations another computation requests of an interaction model;
        "Optimization" – Configurations or cells relaxed toward a minimum of the energy; "Dynamics" –
        Configurations evolved in time; "Sampling" – Configurations sampled from a distribution without a time
        evolution, e.g. Monte Carlo; "Free energy calculation" – A free energy, or a potential of mean force,
        computed from sampled configurations; "Training" – The parameters of a model fitted to data; "Property
        calculation" – A property obtained from given configurations or from the results of another
        computation, e.g. phonons, spectra, or a prediction by a trained model.
    repeatable: false
  - name: structure-label
    required: false
    description: The label of a structure modeled by this computation.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
    notes:
    - >-
      Note: Omit it for a computation that acts only on configurations supplied by a computation that uses
      it, e.g. the DFT that supplies the energies and forces of an ab initio MD run.
  - name: input
    required: false
    description: Another computation in the record whose results this computation uses.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    notes:
    - >-
      Note: Give an input only where the data of this computation cannot be understood without it. A record
      describes the dataset; it does not record the order of the calculations or how to repeat them.
    subproperties:
    - name: computation-label
      required: true
      description: The label of that computation.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: role
      required: true
      description: What this computation takes from that computation.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Interaction model, Initial configuration, Starting point, Training data, Parameters, Source
            data]
        note: >-
          "Interaction model" – The energies and forces of the configurations this computation evaluates;
          "Initial configuration" – The configurations this computation starts from; "Starting point" – An
          electronic ground state, density or wavefunction this computation starts from, e.g. the DFT ground
          state of a GW calculation; "Training data" – Data a model is fitted to; "Parameters" – Values used
          as parameters of this computation's model, e.g. a free energy or elastic constants in a phase field
          model; "Source data" – Results from which this computation obtains a property.
      repeatable: false
  - name: conditions
    required: false
    description: >-
      The conditions imposed on the simulated system during the computation, e.g. by a thermostat, a barostat,
      a loading device or a fixed simulation cell. Omitted when no condition is imposed, e.g. for a single
      point or a training computation.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    notes:
    - >-
      Note: The conditions below, other than type and description, are given as appropriate to the simulation.
      Each is imposed on the simulation as an external constraint. A quantity computed from the simulation,
      e.g. a heat flux measured under an imposed temperature gradient or the temperature of a microcanonical
      run, is a result, not a condition, and is not given here. A condition that varies is given as several
      entries, each with a qualifier; the description explains how it varies.
    subproperties:
    - name: type
      required: true
      description: The nature of the simulation being performed.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      notes:
      - 'Note: Detailed explanations of the simulation conditions are given in `description`.'
      subproperties:
      - name: thermodynamic-state
        required: true
        description: Whether the simulated system is at equilibrium, in a steady state, or evolving in time.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Equilibrium, Steady state, Transient]
          note: >-
            One of: "Equilibrium" – The system samples thermodynamic equilibrium. "Steady state" – A
            nonequilibrium state whose averages do not change in time, maintained by a driving such as a strain
            rate or a heat flux. "Transient" – A state whose averages change in time, e.g. relaxation toward
            equilibrium or a steady state, or a quench.
        repeatable: false
      - name: system-openness
        required: false
        description: What the system exchanges with its surroundings.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Isolated, Closed, Open]
          note: >-
            One of: "Isolated" – Exchanges neither energy nor particles, e.g. the microcanonical ensemble.
            "Closed" – Exchanges energy but not particles, e.g. the canonical or isothermal-isobaric ensemble.
            "Open" – Exchanges particles, or their species, with a reservoir, e.g. the grand-canonical or
            semi-grand-canonical ensemble.
        repeatable: false
      - name: time-dependence
        required: false
        description: How the imposed conditions change during the simulation.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Constant, Varying, Cyclic]
          note: >-
            One of: "Constant" – No imposed condition changes. "Varying" – An imposed condition changes, e.g. a
            temperature ramp or a change of ensemble. "Cyclic" – An imposed condition changes periodically, e.g.
            cyclic loading.
        repeatable: false
      - name: spatial-uniformity
        required: false
        description: How the imposed conditions vary across the system.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Uniform, Nonuniform, Periodic]
          note: >-
            One of: "Uniform" – Every imposed condition is the same throughout the system. "Nonuniform" – An
            imposed condition differs between parts of the system, e.g. a thermostat applied to part of it.
            "Periodic" – An imposed condition varies periodically across the system, e.g. sinusoidal heating.
            Not to be confused with `cell-periodicity`.
        repeatable: false
    - name: description
      required: false
      description: >-
        Explanatory text clarifying the simulation type, and how any condition varies in space or time, e.g.
        a temperature ramp, a thermostat applied to part of the system, or a composition set by chemical
        potentials. For a condition that varies, it states how, e.g. the shape of a ramp or the region a
        value applies to.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
