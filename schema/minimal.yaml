- name: provenance
  required: false
  description: History of the dataset, detailing its origins and transformations.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: event-type
    required: true
    description: Description of change made to the dataset.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Initial creation, Admin update, Version update, Metadata update]
      note: >-
        "Initial creation" – Initial creation of the dataset. "Admin update" – Editorial update to the
        dataset not requiring a version update (e.g. spelling correction). "Version update" – Change to
        the dataset or associated files requiring a new version. "Metadata update" – Change to the
        metadata, but not the dataset itself.
    repeatable: false
  - name: date
    required: true
    description: The date and time when the change was made.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      pattern: '\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ)?'
      examples: ['2021-02-22', '2021-02-22T14:30:00Z']
      note: >-
        A date (YYYY-MM-DD), or a date and time in UTC (YYYY-MM-DDTHH:mm:ssZ), following the
        [ISO 8601 Date and Time Format Standard](https://www.iso.org/iso-8601-date-and-time-format.html).
    repeatable: false
  - name: agent
    required: true
    description: Identity of the entity responsible for the change.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
  - name: comment
    required: false
    description: Explanation for the change in provenance.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
  - name: checksum
    required: false
    description: >-
      A digital fingerprint for the dataset or an associated file modified by the provenance event.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: file
      required: true
      description: The name of the file.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: algorithm
      required: true
      description: The algorithm that computed the checksum.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [SHA1, SHA224, SHA256, SHA384, SHA512, SHA3-256, SHA3-384, SHA3-512, BLAKE2b-256, BLAKE2b-384,
          BLAKE2b-512, BLAKE3, MD2, MD4, MD5, MD6, ADLER32]
        note: >-
          The algorithm names of [SPDX 2.3.1 §8.4](https://spdx.github.io/spdx-spec/v2.3.1/file-information/)
          (File checksum field).
      repeatable: false
    - name: value
      required: true
      description: The checksum of the file, in lowercase hexadecimal digits.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        pattern: '[0-9a-f]+'
      repeatable: false
