        Note: Requires cell, which defines the basis of the vector components.
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: [3]
        kind: MagneticFluxDensity
        recommended-unit: T
        values:
          note: >-
            The components of the magnetic flux density vector <i>B</i>. The magnetic flux density components
            are expressed relative to an orthonormal basis (e<sub>1</sub>, e<sub>2</sub>, e<sub>3</sub>),
            where e<sub>1</sub> is in the direction of a, e<sub>2</sub> is in the direction of c╳a, and
            e<sub>3</sub> = e<sub>1</sub>╳e<sub>2</sub>, where (a, b, c) are the vectors defining the cell,
            which may not be orthogonal.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: qualifier
        required: false
        description: What the value represents.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Average, Final, Initial, Maximum, Minimum]
          note: >-
            Without a qualifier, the value holds throughout the simulation and across the system, and the entry
            is the only one for the condition. Otherwise give one entry for each qualifier that applies, e.g.
            Initial and Final for a ramp, Minimum and Maximum for a range. For a vector or tensor, Minimum and
            Maximum are taken component by component.
        repeatable: false
    - name: body-force
      required: false
      description: >-
        The body force per unit mass imposed on the simulated system, e.g. gravity or a constant force driving
        a flow.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: Requires cell, which defines the basis of the vector components.
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: [3]
        kind: Acceleration
        recommended-unit: m/s^2
        values:
          note: >-
            The components of the body force per unit mass <i>g</i>. The body force components are expressed
            relative to an orthonormal basis (e<sub>1</sub>, e<sub>2</sub>, e<sub>3</sub>), where
            e<sub>1</sub> is in the direction of a, e<sub>2</sub> is in the direction of c╳a, and
            e<sub>3</sub> = e<sub>1</sub>╳e<sub>2</sub>, where (a, b, c) are the vectors defining the cell,
            which may not be orthogonal.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: qualifier
        required: false
        description: What the value represents.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Average, Final, Initial, Maximum, Minimum]
          note: >-
            Without a qualifier, the value holds throughout the simulation and across the system, and the entry
            is the only one for the condition. Otherwise give one entry for each qualifier that applies, e.g.
            Initial and Final for a ramp, Minimum and Maximum for a range. For a vector or tensor, Minimum and
            Maximum are taken component by component.
        repeatable: false
    - name: electrode-potential
      required: false
      description: >-
        The potential of the working electrode imposed on the simulated system, e.g. by a potentiostat in a
        constant-potential simulation, relative to the reference given in `reference`.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: ElectricPotential
        recommended-unit: V
        values:
          note: >-
            The potential of the working electrode relative to `reference`.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: reference
        required: true
        description: The reference against which the potential is given.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [SHE, RHE, Vacuum]
          note: >-
            One of: "SHE" – The standard hydrogen electrode. "RHE" – The reversible hydrogen electrode, at the pH
            of the simulation. "Vacuum" – The vacuum level, giving an absolute potential.
        repeatable: false
      - name: qualifier
        required: false
        description: What the value represents.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Average, Final, Initial, Maximum, Minimum]
          note: >-
            Without a qualifier, the value holds throughout the simulation and across the system, and the entry
            is the only one for the condition. Otherwise give one entry for each qualifier that applies, e.g.
            Initial and Final for a ramp, Minimum and Maximum for a range. For a vector or tensor, Minimum and
            Maximum are taken component by component.
        repeatable: false
    - name: chemical-potential
      required: false
      description: >-
        The chemical potential of a species imposed on the simulated system by a reservoir, e.g. in a
        grand-canonical or semi-grand-canonical simulation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: Energy
        recommended-unit: eV
        values:
          note: >-
            The chemical potential <i>μ</i> per particle, or the difference <i>μ</i>(species) −
            <i>μ</i>(relative-to). An absolute value is relative to the energy zero of the model that supplies
            the energies: the computation's own, or the one named in `input` with the role Interaction model.
            Absolute values from different models do not compare. A value in a molar
            unit (e.g. kJ/mol) is converted to an energy per particle before it is given.
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: species
        required: true
        description: >-
          The species whose chemical potential is given, as an element symbol, a user-defined species or a
          group of a material component's formula.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          examples: [Cu, H2O, Ja]
        repeatable: false
      - name: relative-to
        required: false
        description: >-
          A second species, when the value is the difference between the chemical potentials of species and of
          this one.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
        notes:
        - >-
          Note: Give relative-to when the simulation imposes a difference of chemical potentials, as a
          semi-grand-canonical simulation does.
      - name: qualifier
        required: false
        description: What the value represents.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Average, Final, Initial, Maximum, Minimum]
          note: >-
            Without a qualifier, the value holds throughout the simulation and across the system, and the entry
            is the only one for the species. Otherwise give one entry for each qualifier that applies, e.g.
            Initial and Final for a ramp, Minimum and Maximum for a range. For a vector or tensor, Minimum and
            Maximum are taken component by component.
        repeatable: false
  - name: software
    required: true
    description: >-
      A program, package or script used to perform the calculations: the simulation code, a calculation
      method or workflow framework that drives it, or a custom script.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    notes:
    - >-
      Note: Give one entry for each layer that took part, outermost first. A file is given under the entry
      that reads it; for a script, its own code is its file.
    subproperties:
    - name: name
      required: true
      description: The name of the software package.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        examples: [VASP]
      repeatable: false
    - name: role
      required: false
      description: The part this software played in the calculations.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Calculation method, Interaction model, Script, Simulation code, Workflow framework]
        note: >-
          One of: "Calculation method" – A packaged procedure that computes a defined property, e.g. an
          OpenKIM test or an iprPy calculation. "Interaction model" – The implementation of a particle
          interaction model, e.g. a KIM model or a potential file; give its identifier and link. "Script" – Custom code written for the calculations, e.g. a
          Python script using ASE. "Simulation code" – A program that performs the simulation or calculation
          itself, e.g. LAMMPS or VASP. "Workflow framework" – A system that sets up, runs and manages
          calculations with other software, e.g. pyiron, AiiDA or MedeA.
      repeatable: false
    - name: description
      required: false
      description: What this software did in the calculations.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: version
      required: false
      description: The version of the software package.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        examples: ['6.3.1']
      repeatable: false
      notes:
      - >-
        Note: Give the version for an official release. For any other state of the code, e.g. a branch or a
        tag, give link and revision.
    - name: link
      required: false
      description: A URI for the software, e.g. its source repository or home page.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        format: uri
      repeatable: false
    - name: revision
      required: false
      description: A tag or commit in the repository given in link.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
      notes:
      - 'Note: Give the full commit hash where possible; a tag or a branch can move.'
    - name: identifier
      required: false
      description: A persistent identifier of the software or of the exact state of its code.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      subproperties:
      - name: value
        required: true
        description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: scheme
        required: true
        description: The identifier scheme that the value belongs to.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [DOI, SWHID]
          note: >-
            A Digital Object Identifier (DOI) for the software or a version of it (e.g. a Zenodo software DOI),
            or a Software Heritage ID (SWHID) for the exact state of its code, released or not.
        repeatable: false
    - name: dependency
      required: false
      description: A component the software was built with or ran on that can change its results.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: List the components that can change results, e.g. the compiler, the MPI, linear-algebra and FFT
        libraries, and libraries such as LibXC.
      subproperties:
      - name: name
        required: true
        description: The name of the component.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: version
        required: false
        description: The version of the component.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: role
        required: false
        description: The kind of component.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Compiler, FFT library, Interpreter, Library, Linear algebra library, MPI library]
          note: >-
            One of: "Compiler" – Translates source code into an executable, e.g. GCC or the Intel oneAPI
            compilers. "FFT library" – Computes fast Fourier transforms, e.g. FFTW. "Interpreter" – Runs a
            script, e.g. Python. "Library" – Any other library the software calls, e.g. LibXC or ASE. "Linear
            algebra library" – Provides BLAS, LAPACK or ScaLAPACK routines, e.g. OpenBLAS or Intel MKL. "MPI
            library" – Implements the Message Passing Interface (MPI), e.g. Open MPI or MPICH.
        repeatable: false
    - name: build-options
      required: false
      description: >-
        The options the software was built or run with that can change its results, e.g. compiler flags or
        enabled features.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: file
      required: false
      description: >-
        Input or output file for the software package associated with the computation. This includes the
        input file used to perform the computation, associated data files, and output generated by the
        software package. Most important are input files to enable reproduction of the dataset.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      subproperties:
      - name: name
        required: true
        description: The file name.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: description
        required: true
        description: A brief description of the file and its contents.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: contents
        required: false
        description: >-
          The contents of the file: its text, or its bytes encoded as given in encoding. Not required in case
          a link to the file is provided instead.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: encoding
        required: false
        description: How contents is encoded.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Base64]
        repeatable: false
        notes:
        - >-
          Note: Without encoding, contents is the file's text. With Base64, contents is the file's bytes
          encoded as Base64 (RFC 4648); use it for a binary file, or for a text file whose exact bytes matter.
      - name: link
        required: false
        description: A URI pointing to a permanent location of the file online.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          format: uri
        repeatable: false
      - name: checksum
        required: true
        description: A digital fingerprint of the file, computed by a named algorithm.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: true
        subproperties:
        - name: algorithm
          required: true
          description: The algorithm that computed the checksum.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            terms: [SHA1, SHA224, SHA256, SHA384, SHA512, SHA3-256, SHA3-384, SHA3-512, BLAKE2b-256, BLAKE2b-384,
              BLAKE2b-512, BLAKE3, MD2, MD4, MD5, MD6, ADLER32]
            note: >-
              The algorithm names of [SPDX 2.3.1 §8.4](https://spdx.github.io/spdx-spec/v2.3.1/file-information/)
              (File checksum field).
          repeatable: false
        - name: value
          required: true
          description: The checksum of the file, in lowercase hexadecimal digits.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            pattern: '[0-9a-f]+'
          repeatable: false
- name: publication
  required: false
  description: >-
    A publication that describes the dataset or the work that produced it, e.g. a journal article or
    preprint, to be cited when the dataset is used.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  notes:
  - 'Note: The location where the dataset itself is stored is given in `dataset-location`.'
  subproperties:
  - name: reference
    required: true
    description: Text that uniquely identifies the source of information being cited.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
