section: minimal
title: 2.1 Minimal MatCore Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The minimal MatCore metadata includes aspects of a dataset deemed important to report for data findability and reuse and are universal across all computational methods. The list of minimal metadata is tabulated below.
examples:
  - caption: Minimal MatCore Metadata
    file: minimal.xml
    source: https://doi.org/10.60732/8e9bc5b0
    notes: >-
      The matcore-id format in the example is tentative and subject to change.
properties:
- name: creator
  required: true
  description: >-
    A primary entity (e.g. person, organization, software agent) responsible for creating the dataset's core content and their institutional affiliation if relevant.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: name
    required: true
    description: The name of the entity that generated the dataset.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      examples: [Albert Einstein, Lawrence Livermore National Laboratory, Claude Opus 5.5]
    repeatable: false
  - name: identifier
    required: false
    description: >-
      A unique, persistent identifier that globally and unambiguously identifies the entity that created
      the dataset.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: value
      required: true
      description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: scheme
      required: true
      description: The identifier scheme that the value belongs to.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [ORCID, ROR, DOI, SWHID, ISNI]
        note: >-
          For individuals, an ORCID ID; for organizations, an ROR ID; for software or AI agents, a Digital
          Object Identifier (DOI) generated specifically for the software code or version (e.g., a Zenodo
          software DOI) or a Software Heritage ID (SWHID) pointing to the exact software release or state.
          An ISNI may identify either individuals or organizations.
      repeatable: false
  - name: affiliation
    required: false
    description: The affiliation of the entity that generated the dataset if they have one.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: name
      required: true
      description: The name of the affiliation.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: identifier
      required: false
      description: >-
        A unique, persistent identifier that globally and unambiguously identifies the affiliation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: scheme
        required: true
        description: The identifier scheme that the value belongs to.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [ROR, ISNI]
        repeatable: false
- name: contributor
  required: false
  description: >-
    An entity (e.g. person, organization, software agent) that provided secondary support, specialized skills, or resources to the dataset's development, but is not considered a primary author, and their institutional affiliation if relevant.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: name
    required: true
    description: The name of the entity that contributed to the dataset.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      examples: [Albert Einstein, Lawrence Livermore National Laboratory, Claude Opus 5.5]
    repeatable: false
  - name: identifier
    required: false
    description: >-
      A unique, persistent identifier that globally and unambiguously identifies the entity that
      contributed to the dataset.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: value
      required: true
      description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: scheme
      required: true
      description: The identifier scheme that the value belongs to.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [ORCID, ROR, DOI, SWHID, ISNI]
        note: >-
          For individuals, an ORCID ID; for organizations, an ROR ID; for software or AI agents, a Digital
          Object Identifier (DOI) generated specifically for the software code or version (e.g., a Zenodo
          software DOI) or a Software Heritage ID (SWHID) pointing to the exact software release or state.
          An ISNI may identify either individuals or organizations.
      repeatable: false
  - name: affiliation
    required: false
    description: The affiliation of the entity that contributed to the dataset if they have one.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: name
      required: true
      description: The name of the affiliation.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: identifier
      required: false
      description: >-
        A unique, persistent identifier that globally and unambiguously identifies the affiliation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: value
        required: true
        description: The identifier, in the form Annex I gives for its scheme when the scheme is listed there.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: scheme
        required: true
        description: The identifier scheme that the value belongs to.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [ROR, ISNI]
        repeatable: false
- name: title
  required: true
  description: A single sentence description of the dataset.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values: null
  repeatable: false
- name: creation-date
  required: true
  description: The calendar date and time when the dataset was created.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values:
    pattern: '\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(T([01]\d|2[0-3]):[0-5]\d:[0-5]\dZ)?'
    examples: ['2021-02-22', '2021-02-22T14:30:00Z']
    note: >-
      A date (YYYY-MM-DD), or a date and time in UTC (YYYY-MM-DDTHH:mm:ssZ), following the
      [ISO 8601 Date and Time Format Standard](https://www.iso.org/iso-8601-date-and-time-format.html).
  repeatable: false
- name: description
  required: true
  description: A synopsis of the dataset, its contents, and purpose.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values:
    note: >-
      This can optionally include information on the format in which the dataset is stored (e.g. pointer
      to a relevant schema).
  repeatable: false
- name: disclaimer
  required: false
  description: >-
    A statement of applicability provided by the creator(s) informing users of the intended use and/or
    limitations of this dataset.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values: null
  repeatable: false
- name: material-component
  required: true
  description: >-
    A description of the chemical composition and structure of a substance in this dataset.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: constituent
    required: true
    description: A chemical element included in the material component and its concentration.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: species
      required: true
      description: A chemical element included in the material.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        enum: [H, He, Li, Be, B, C, N, O, F, Ne, Na, Mg, Al, Si, P, S, Cl, Ar, K, Ca, Sc, Ti, V, Cr, Mn, Fe,
          Co, Ni, Cu, Zn, Ga, Ge, As, Se, Br, Kr, Rb, Sr, Y, Zr, Nb, Mo, Tc, Ru, Rh, Pd, Ag, Cd, In, Sn, Sb,
          Te, I, Xe, Cs, Ba, La, Ce, Pr, Nd, Pm, Sm, Eu, Gd, Tb, Dy, Ho, Er, Tm, Yb, Lu, Hf, Ta, W, Re, Os,
          Ir, Pt, Au, Hg, Tl, Pb, Bi, Po, At, Rn, Fr, Ra, Ac, Th, Pa, U, Np, Pu, Am, Cm, Bk, Cf, Es, Fm, Md,
          'No', Lr, Rf, Db, Sg, Bh, Hs, Mt, Ds, Rg, Cn, Nh, Fl, Mc, Lv, Ts, Og]
        examples: [C]
        note: >-
          The symbol of the element, as in the IUPAC Periodic Table of the Elements (listed with atomic
          numbers 1 to 118 in the [Standard Atomic Weights](https://www.ciaaw.org/atomic-weights.htm) table
          of the IUPAC Commission on Isotopic Abundances and Atomic Weights).
      repeatable: false
    - name: concentration
      required: true
      description: The atomic fraction of the material composed of this element, in percent.
      type: float
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 0
        maximum: 100
      repeatable: false
  - name: phases
    required: true
    description: The phase(s) of the material included in the dataset.
    type: string
    extent: [':']
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Amorphous, Crystal, Quasicrystal, Molecule, Liquid, Gas, Plasma]
      note: >-
        One or more of: "Amorphous" – A solid material without crystalline order. "Crystal" – A solid
        material characterized by a repeating pattern of atoms. "Quasicrystal" – A crystal-like material
        with short-range order, but without long-range order. "Molecule" – A finite group of atoms bonded
        together forming an independent unit. "Liquid" – A fluid structure (e.g. the molten state of a
        material). "Gas" – A structure where atoms are far apart and only interact during collisions.
        "Plasma" – A gas comprised of ions and electrons.
    repeatable: false
  - name: description
    required: false
    description: >-
      An explanation of the nature of the material, e.g. a crystal structure designation, a chemical formula
      for a molecule, etc.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
  - name: microstructure
    required: false
    description: >-
      For a solid state phase, a description of the arrangement of phases, grains and defects in the
      material.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
- name: computation
  required: true
  description: A description of a computer simulation used to generate data in the dataset.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  legacy_values: Contains SubProperties as listed below.
  subproperties:
  - name: method-class
    required: true
    description: The general category to which the computational technique belongs.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    notes:
    - >-
      Note:The categories listed above are based on the [MODA standard](https://data.europa.eu/doi/10.2777/404734).
    legacy_values: >-
      A string containing one of the following values: "Electronic" "Atomistic" "Mesoscopic" "Continuum"
      "Data-driven" Other user-specified value if none of the above apply.
  - name: method
    required: true
    description: The computational materials science (CMS) approach used in the computation.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    legacy_values: >-
      A string containing one of the following values: For method-class "Electronic": "CC" – Coupled Cluster
      "QMC" – Quantum Monte Carlo "DFT" – Density Functional Theory "MBPT" – Many-Body Perturbation Theory
      methods (such as GW and BSE) For method-class "Atomistic": "MC" – Monte Carlo "MD" – Molecular Dynamics
      For method-class "Mesoscopic": "DDD" – Discrete Dislocation Dynamics "KMC" – Kinetic Monte Carlo
      "CGMD" – Coarse-grained MD For method-class "Continuum": "PF" – Phase Field For method-class "Data-driven":
      "ML" – Machine Learning Other user-specified value if none of the above apply.
  - name: simulation-conditions
    required: true
    description: >-
      The interactions between the system being modeled and the rest of the world maintained during the
      computation.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    legacy_values: Contains SubSubProperties as defined in the table below.
    subproperties:
    - name: type
      required: true
      description: >-
        The nature of the simulation being performed, whether equilibrium, nonequilibrium, or nonstandard.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        String containing one of the following values defining the simulation conditions: "Equilibrium"
        – Thermodynamic equilibrium "Nonequilibrium" – Conforming to some definition of nonequilibrium
        thermodynamics "Other" – A simulation not fitting into the equilibrium and nonequilibrium categories.
        Note 1: The SubSubProperties listed below (aside from description) are provided as appropriate
        given the nature of the simulation. Providing a SubSubProperty means that its value is imposed
        on the simulation as an external constraint. Note 2:Units for dimensioned variables are to be
        given in the SI unit system.
    - name: description
      required: false
      description: Explanatory text clarifying the simulation type selection.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: A string containing the simulation type explanation.
    - name: number-of-particles
      required: false
      description: A count of atoms or other discrete entities comprising the material.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: An integer containing the number of particles *N*.
      legacy_unit: dimensionless
    - name: volume
      required: false
      description: The amount of space occupied by the material.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: A real number containing the volume *V*.
      legacy_unit: cubic meters (m^3)
    - name: mass-density
      required: false
      description: The total mass of the material divided by the volume it occupies.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: A real number containing the mass density *𝜌*.
      legacy_unit: kilograms per cubic meter (kg/m^3)
    - name: number-density
      required: false
      description: >-
        The total number of particles comprising the material divided by the volume it occupies.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: A real number containing the number density *n*.
      legacy_unit: inverse cubic meter (1/m^3)
    - name: cell
      required: false
      description: The domain occupied by the material in the simulation (if fixed).
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        Ordered list of three vectors (a, b, c), each with three components, that define the simulation
        cell. The vectors (a, b, c) need not be orthogonal, and the magnitudes (│a│, │b│, │c│) are the
        supercell vector lengths.
      legacy_unit: meter (m)
    - name: cell-reference
      required: false
      description: >-
        The domain occupied by the material in the simulation in configuration relative to which strains
        are defined.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        Ordered list of three vectors (a0, b0, c0), each with three components, that define the cell used
        in the simulation in its reference configuration. The vectors (a0, b0, c0) need not be orthogonal,
        and the magnitudes (│a0│, │b0│, │c0│) are the reference cell vector lengths.
      legacy_unit: meter (m)
    - name: cell-periodicity
      required: false
      description: >-
        Specification of whether periodic boundary conditions are applied along the cell vector directions.
        This applies to both cell and cell-reference.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        Ordered list of three booleans (*pa*,, *pb*,, *pc*,), which are set to true if periodic boundary
        conditions are applied along the corresponding cell vectors (a, b, c).
    - name: temperature
      required: false
      description: >-
        A measure of the hotness or coldness of an external heat bath in thermal contact with the material.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: A real number containing the temperature *T*.
      legacy_unit: kelvin (K)
    - name: stress
      required: false
      description: >-
        A uniform force per unit current area, including both normal and shear components, applied to
        the material during the simulation through contact with an external loading device.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        An array of six real numbers containing the components of the (symmetric) Cauchy stress tensor
        σ in the following order: [*σ*11, *σ*22, *σ*33, *σ*23, *σ*13, *σ*12]. The stress component are
        expressed relative to an orthonormal basis (e1, e2, e3), where e1 is in the direction of a, e2
        is in the direction of c╳a, and e3= e1╳e2, where (a, b, c) are the vectors defining the cell,
        which may not be orthogonal. Note 1: Requires the definition of the cell subproperty in order
        for a basis to be defined relative to which the tensor components are given. Note 2:The adopted
        sign convention is for tensile normal stresses to be positive, and compressive normal stresses
        to be negative. This implies that for a material subjected to a positive pressure *p*, the stress
        tensor components are [-*p*, -*p*, -*p*, 0, 0, 0].
      legacy_unit: pascal (Pa)
    - name: strain
      required: false
      description: >-
        A deformation relative to a reference configuration imposed on the simulation cell expressed in
        the referential frame (Lagrangian strain tensor).
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        An array of six real numbers containing the components of the (symmetric) Lagrangian strain tensor
        Ein the following order: [*E*11, *E*22, *E*33, *E*23, *E*13, *E*12]. The strain component are
        expressed relative to an orthonormal basis (e1, e2, e3), where e1 is in the direction of a0, e2
        is in the direction of c0╳a0, and e3= e1╳e2, where (a0, b0, c0) are the vectors defining the cell
        in the reference configuration, which may not be orthogonal. Note: Requires the definition of
        cell-reference in order for the basis to be defined relative to which the tensor components are
        given.
      legacy_unit: dimensionless
    - name: strain-rate
      required: false
      description: >-
        The derivative with respect to time of a deformation relative to a reference configuration imposed
        on the simulation cell expressed in the referential frame (Lagrangian strain rate tensor), which
        is constant throughout the simulation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      notes:
      - >-
        Requires the definition of cell-reference in order for the basis to be defined relative to which
        the tensor components are given
      legacy_values: >-
        An array of six real numbers containing the components of the (symmetric) Lagrangian strain rate
        tensor E in the following order: [*E11, E22, E33, E23, E13, E12,*]. The strain component are expressed
        relative to an orthonormal basis (e1, e2, e3), where e1 is in the direction of a0, e2 is in the
        direction of c0╳a0, and e3= e1╳e2, where (a0, b0, c0) are the vectors defining the cell in the
        reference configuration, which may not be orthogonal.
      legacy_unit: inverse seconds (1/s)
    - name: heat-flux
      required: false
      description: >-
        The amount of thermal energy transferred to the material per unit area per unit time along a given
        direction.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        An array of three real numbers containing the components of the heat flux vector q. The heat flux
        component are expressed relative to an orthonormal basis (e1, e2, e3), where e1 is in the direction
        of a, e2 is in the direction of c╳a, and e3= e1╳e2, where (a, b, c) are the vectors defining the
        cell, which may not be orthogonal.
      legacy_unit: watts per square meter (W/m^2)
    - name: temperature-gradient
      required: false
      description: >-
        A physical quantity that describes the rate and direction of maximum temperature change per unit
        distance.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        An array of three real numbers containing the components of the temperature gradient vector ∇*T*.
        The temperature gradient component are expressed relative to an orthonormal basis (e1, e2, e3),
        where e1 is in the direction of a, e2 is in the direction of c╳a, and e3= e1╳e2, where (a, b,
        c) are the vectors defining cell, which may not be orthogonal.
      legacy_unit: kelvin per meter (K/m)
  - name: software
    required: true
    description: Identification of a computer package used to perform the calculations.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    legacy_values: Contains SubSubProperties as defined in the table below.
    subproperties:
    - name: name
      required: true
      description: The name of the software package.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: A string containing the name of the software package (e.g. "VASP").
    - name: version
      required: false
      description: The version of the software package.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: A string containing the software version (e.g. "6.3.1")
    - name: file
      required: false
      description: >-
        Input or output file for the software package associated with the computation. This includes the
        input file used to perform the computation, associated data files, and output generated by the
        software package. Most important are input files to enable reproduction of the dataset.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      legacy_values: Contains SubSubSubProperties as defined in the table below.
      subproperties:
      - name: name
        required: true
        description: The file name.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: A string containing the name of the included file.
      - name: description
        required: true
        description: A brief description of the file and its contents.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: A string containing the file description.
      - name: contents
        required: false
        description: >-
          The text and/or data contained in the file. Not required in case a link to the file is provided
          instead.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: A string containing the file contents.
      - name: link
        required: false
        description: A URI pointing to a permanent location of the file online.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: A string containing the file URI.
- name: citation
  required: false
  description: Information that uniquely identifies a source being acknowledged.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  legacy_values: Contains SubProperties as listed below.
  subproperties:
  - name: reference
    required: true
    description: Text that uniquely identifies the source of information being cited.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    legacy_values: A string containing the reference to the source.
  - name: doi
    required: false
    description: The digital object identifier (DOI) for the source.
