- name: license
  required: true
  description: >-
    A contract defining the terms and conditions under which the dataset can be used.
  type: string
  extent: []
  kind: inapplicable
  recommended-unit: null
  values:
    examples: [GPL-3.0-only, CC-BY-4.0]
    note: >-
      A license expression as defined in the [SPDX specification, version
      2.3.1](https://spdx.github.io/spdx-spec/v2.3.1/SPDX-license-expressions/), built from current
      identifiers of the [SPDX License List](https://spdx.org/licenses/): a single identifier (e.g.
      `GPL-3.0-only`) or a combination (e.g. `MIT OR Apache-2.0`). A license not on the list is written
      `LicenseRef-` followed by an identifier.
  repeatable: false
