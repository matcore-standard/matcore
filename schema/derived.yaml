section: derived
title: 2.7 Derived Property Metadata
matcore_version: 0.9-draft-baseline
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The metadata for derived properties (MatCore-Der) is tabulated below. This refers to properties computed from data generated using a CMS method documented elsewhere in this section (e.g. spectroscopy computations based on DFT data). (Notes: (1) This standard inherits the metadata in the minimal MatCore standard and one of the associated methods metadata, adding the properties below. (2) Derived properties in this category are limited to properties based on a single method. Derived properties involving a combination of multiple methods (e.g. MD and ML) are not supported. An exception is MBPT, which itself is based on DFT.)

  Examples of derived properties include:

  - Electronic (band structure, density of states (DOS), projected DOS, dielectric function, charge and bonding analysis, etc.)
  - Electron-phonon interactions (superconducting properties, line widths, etc.)
  - Linear-response (phonon modes, dispersion, interatomic force constants, vibrational DOS, etc.)
  - Magnetic (magnetics, magnetization, magnons, etc.)
  - Microscopy, electron (S/TEM, 4D-STEM, SAED, etc.)
  - Microscopy, scanning probe (STM, AFM, etc.)
  - NMR (chemical shifts)
  - Optical (electronic excitation spectra, low-loss EELS, etc.)
  - Spectroscopy, core-level (XAS, XES, core-loss EELS, XPS, etc.)
  - Spectroscopy, vibrational (Raman, Infrared spectroscopy, etc.)
  - Transport (electronic conductivity, thermal conductivity, etc.)
  - X-ray scattering (diffraction, reflectivity, pair-distribution function, etc.)
properties:
- name: derived-property
  required: true
  description: >-
    Details of a quantity related to material behavior computed based on a computational materials science
    (CMS) calculation covered by the MatCore standard.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  legacy_values: Contains SubProperties as listed below.
  subproperties:
  - name: type
    required: true
    description: Kind of physical quantity being computed.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    legacy_values: >-
      String one of the following values that defines the type of the computed derived property: "Electronic"
      "Electron-phonon interactions" "Linear-response" "Magnetic" "Microscopy, electron" "Microscopy,
      scanning probe" "NMR" "Optical" "Spectroscopy, core-level" "Spectroscopy, vibrational" "Transport"
      "X-ray scattering" Other user-specified value if none of the above apply.
  - name: description
    required: true
    description: Explanation of the derived property.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    legacy_values: >-
      A string containing an explanation of the specific derived property that was computed.
  - name: calculation-method
    required: true
    description: >-
      Details regarding an approach used to obtain the derived property. Multiple approaches may be involved
      in the computation.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    legacy_values: Contains SubSubProperties as defined in the table below.
    subproperties:
    - name: description
      required: true
      description: Description of the method used to obtain the derived property.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        A string containing a human-readable description of the approach and/or algorithm used to compute
        the derived property.
    - name: calculation-parameter
      required: false
      description: A parameter associated with the specified calculation method.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      legacy_values: Contains SubSubSubProperties as defined in the table below.
      subproperties:
      - name: name
        required: true
        description: >-
          The designation of the parameter associated with the specified derived property calculation
          method.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: A string containing the name of the calculation parameter.
      - name: value
        required: true
        description: The data associated with the calculation parameter.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: An integer, real, boolean, or string containing the calculation parameter value.
      - name: unit
        required: true
        description: >-
          A standardized string or identifier that defines the dimension or measurement system of the
          associated value.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: >-
          A string containing the units of the value in the [GNU unit convention](https://www.gnu.org/software/units/)
          (or the text "dimensionless").
      - name: description
        required: false
        description: An explanation of the meaning, source, or purpose of the calculation parameter.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: >-
          A string explaining the computation parameter (e.g. "The spin-spin coupling constant for an
          NMR spectroscopy calculation").
