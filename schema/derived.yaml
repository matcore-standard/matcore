section: derived
title: 2.8 Derived Property (DP) Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The metadata for derived properties (MatCore-DP) is tabulated below. A derived property is a property obtained from the results of other computations, e.g. a Raman spectrum computed from phonon modes and dielectric tensors obtained by DFT. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below.)

  The properties are given in settings blocks, each naming the computations it describes. Usually the derived properties of a dataset come from one computation in minimal `computation` whose `method` is DP (method-class Post-processing). It names the computations whose results it uses in `input`, with the role Source data, e.g. the DFT computation that gave the forces and dielectric tensors, or Interaction model for energies and forces it requests as it proceeds. Its block here gives one `derived-property` entry for each property, with the procedure that obtained it and its parameters in `procedure` and `calculation-parameter`, e.g. the finite-difference displacement of the atoms. A property obtained within a computation of another method, e.g. phonons computed by density functional perturbation theory in a DFT computation, is given in a block naming that computation.

  Examples of derived properties include:

  - Electronic (band structure, density of states (DOS), projected DOS, dielectric function, charge and bonding analysis, etc.)
  - Electron-phonon interactions (superconducting properties, line widths, etc.)
  - Magnetic (magnetics, magnetization, magnons, etc.)
  - Mechanical (elastic constants, stress-strain response, etc.)
  - Microscopy, electron (S/TEM, 4D-STEM, SAED, etc.)
  - Microscopy, scanning probe (STM, AFM, etc.)
  - NMR (chemical shifts)
  - Optical (electronic excitation spectra, low-loss EELS, etc.)
  - Spectroscopy, core-level (XAS, XES, core-loss EELS, XPS, etc.)
  - Spectroscopy, vibrational (Raman, Infrared spectroscopy, etc.)
  - Thermodynamic (free energies, heat capacity, formation energies, etc.)
  - Transport (electronic conductivity, thermal conductivity, etc.)
  - Vibrational (phonon modes, dispersion, interatomic force constants, vibrational DOS, etc.)
  - X-ray scattering (diffraction, reflectivity, pair-distribution function, etc.)
examples:
  - caption: Derived Property Metadata
    file: derived.json
    source: https://archive.materialscloud.org/record/2024.116
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: derived-property
    required: true
    description: >-
      Details of a quantity related to material behavior computed based on a computational materials science
      (CMS) calculation covered by the MatCore standard.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    legacy_values: Contains SubProperties as listed below.
    subproperties:
    - name: type
      required: true
      description: Kind of physical quantity being computed.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        String one of the following values that defines the type of the computed derived property: "Electronic"
        "Electron-phonon interactions" "Linear-response" "Magnetic" "Microscopy, electron" "Microscopy,
        scanning probe" "NMR" "Optical" "Spectroscopy, core-level" "Spectroscopy, vibrational" "Transport"
        "X-ray scattering" Other user-specified value if none of the above apply.
    - name: description
      required: true
      description: Explanation of the derived property.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        A string containing an explanation of the specific derived property that was computed.
    - name: procedure
      required: true
      description: Description of the method used to obtain the derived property.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        A string containing a human-readable description of the approach and/or algorithm used to compute
        the derived property.
    - name: calculation-parameter
      required: false
      description: A parameter associated with the specified calculation method.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      legacy_values: Contains SubSubSubProperties as defined in the table below.
      subproperties:
      - name: name
        required: true
        description: >-
          The designation of the parameter associated with the specified derived property calculation
          method.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: A string containing the name of the calculation parameter.
      - name: value
        required: true
        description: The data associated with the calculation parameter.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: An integer, real, boolean, or string containing the calculation parameter value.
      - name: unit
        required: true
        description: >-
          A standardized string or identifier that defines the dimension or measurement system of the
          associated value.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: >-
          A string containing the units of the value in the [GNU unit convention](https://www.gnu.org/software/units/)
          (or the text "dimensionless").
      - name: description
        required: false
        description: An explanation of the meaning, source, or purpose of the calculation parameter.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: >-
          A string explaining the computation parameter (e.g. "The spin-spin coupling constant for an
          NMR spectroscopy calculation").
