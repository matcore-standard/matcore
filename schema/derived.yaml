section: derived
title: 2.8 Derived Property (DP) Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The metadata for derived properties (MatCore-DP) is tabulated below. A derived property is a property obtained from the results of other computations, e.g. a Raman spectrum computed from phonon modes and dielectric tensors obtained by DFT. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below.)

  The properties are given in settings blocks, each naming the computations it describes. Usually the derived properties of a dataset come from one computation in minimal `computation` whose `method` is DP (method-class Post-processing). It names the computations whose results it uses in `input`, with the role Source data, e.g. the DFT computation that gave the forces and dielectric tensors, or Interaction model for energies and forces it requests as it proceeds. Its block here gives one `derived-property` entry for each property, with the procedure that obtained it and its parameters in `procedure` and `calculation-parameter`, e.g. the finite-difference displacement of the atoms. A property obtained within a computation of another method, e.g. phonons computed by density functional perturbation theory in a DFT computation, is given in a block naming that computation.

  Examples of derived properties include:

  - Electronic (band structure, density of states (DOS), projected DOS, dielectric function, charge and bonding analysis, etc.)
  - Electron-phonon interactions (superconducting properties, line widths, etc.)
  - Magnetic (magnetics, magnetization, magnons, etc.)
  - Mechanical (elastic constants, stress-strain response, etc.)
  - Microscopy, electron (S/TEM, 4D-STEM, SAED, etc.)
  - Microscopy, scanning probe (STM, AFM, etc.)
  - NMR (chemical shifts)
  - Optical (electronic excitation spectra, low-loss EELS, etc.)
  - Scattering (X-ray and neutron diffraction, reflectivity, pair-distribution function, etc.)
  - Spectroscopy, core-level (XAS, XES, core-loss EELS, XPS, etc.)
  - Spectroscopy, vibrational (Raman, Infrared spectroscopy, etc.)
  - Thermodynamic (free energies, heat capacity, formation energies, etc.)
  - Transport (electronic conductivity, thermal conductivity, etc.)
  - Vibrational (phonon modes, dispersion, interatomic force constants, vibrational DOS, etc.)
examples:
  - caption: Derived Property Metadata
    file: derived.json
    source: https://archive.materialscloud.org/record/2024.116
legacy_complete: true
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: derived-property
    required: true
    description: >-
      Details of a quantity related to material behavior computed based on a computational materials science
      (CMS) calculation covered by the MatCore standard.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    notes:
    - 'Note: Give one entry for each property.'
    subproperties:
    - name: type
      required: true
      description: The kind of property computed.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Electronic, Electron-phonon interactions, Magnetic, Mechanical, 'Microscopy, electron', 'Microscopy,
            scanning probe', NMR, Optical, Scattering, 'Spectroscopy, core-level', 'Spectroscopy, vibrational',
          Thermodynamic, Transport, Vibrational]
        note: >-
          "Electronic" – The electronic structure and quantities obtained from it, e.g. a band structure, a density
          of states, a dielectric function, or a charge and bonding analysis. "Electron-phonon interactions" – The
          coupling of electrons and lattice vibrations, e.g. superconducting properties or phonon linewidths.
          "Magnetic" – Magnetic order and its excitations, e.g. a magnetization, exchange constants or magnons.
          "Mechanical" – The response to a mechanical load, e.g. elastic constants or a stress-strain response.
          "Microscopy, electron" – A simulated electron microscopy image or diffraction pattern, e.g. S/TEM,
          4D-STEM or SAED. "Microscopy, scanning probe" – A simulated scanning probe image, e.g. STM or AFM.
          "NMR" – Nuclear magnetic resonance parameters, e.g. chemical shifts. "Optical" – The response to light
          through electronic excitations, e.g. an absorption spectrum or low-loss EELS. "Scattering" – The
          scattering of X-rays or neutrons by the structure, e.g. a diffraction pattern, reflectivity or a
          pair-distribution function. "Spectroscopy, core-level" – Spectra from excitations of core electrons,
          e.g. XAS, XES, core-loss EELS or XPS. "Spectroscopy, vibrational" – A simulated vibrational spectrum for
          comparison with a measurement, e.g. a Raman or infrared spectrum. "Thermodynamic" – Thermodynamic
          quantities, e.g. free energies, heat capacities or formation energies. "Transport" – The transport of
          charge, heat or mass, e.g. an electrical or thermal conductivity or a diffusion coefficient.
          "Vibrational" – The vibrations of the atoms themselves, e.g. phonon modes and dispersion, interatomic
          force constants or a vibrational density of states.
      repeatable: false
    - name: name
      required: true
      description: The specific property computed.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        examples: [Raman spectrum, Phonon dispersion]
      repeatable: false
    - name: description
      required: true
      description: Explanation of the derived property.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: procedure
      required: true
      description: >-
        How the property was obtained from the results of the computations named in minimal `computation ›
        input`.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
      notes:
      - >-
        Note: Explain the role of each `calculation-parameter` entry. The parameters of the calculations the
        procedure requests from other computations, e.g. the finite-difference displacement of the atoms, are
        given here, not in the descriptions of those computations.
    - name: calculation-parameter
      required: false
      description: A parameter of the procedure that obtained the derived property.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: For example, a supercell size, a finite-difference displacement, a broadening width, or the
        spin-spin coupling constant of an NMR calculation.
      subproperties:
      - name: name
        required: true
        description: The designation of the calculation parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: value
        required: true
        description: The data associated with the calculation parameter.
        type: any
        extent: any
        kind: any
        recommended-unit: null
        values: null
        repeatable: false
      - name: unit
        required: true
        description: The unit in which the associated value is expressed.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
            only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
            (accepted with a validation warning).
        repeatable: false
      - name: description
        required: false
        description: An explanation of the meaning, source, or purpose of the calculation parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
