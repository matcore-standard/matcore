section: pim
title: 2.3 Particle Interaction Model (PIM) Metadata
source: >-
  Moved from md.yaml by decision 0046 (particle-style, particle-interactions, charge-interaction and
  magnetic-interaction). legacy_* fields hold the baseline prose and are to be replaced by typed fields in
  subsequent PRs.
introduction: |
  The metadata for particle interaction models (MatCore-PIM) is tabulated below. A particle interaction model gives the energy and forces of a system of particles as an explicit function of the particles' coordinates, without solving for a wavefunction or an electron density, e.g. an interatomic potential, a machine-learned interatomic potential, a bonded force field, a coarse-grained model or the electron force field. These properties describe a computation whose method is PIM, the evaluation of energies and forces used by another computation, e.g. molecular dynamics. The properties are given in settings blocks, each naming the PIM computations it describes. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below.)
examples:
  - caption: PIM Method-Specific Metadata
    file: pim.json
    source: https://doi.org/10.6084/m9.figshare.6273170
legacy_complete: true
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: theory-level
    required: true
    description: How the functional form of the model was obtained.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Physics-based, Machine-learned]
      note: |-
        - "Physics-based" – A functional form built from a physical model of the interactions, with parameters fitted to data, e.g. EAM, Tersoff, a bonded force field or the electron force field
        - "Machine-learned" – A machine learning model trained to take particle positions as input, e.g. GAP or MACE
    repeatable: false
  - name: model-type
    required: true
    description: The kind of potential used to compute the particle interactions.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      examples: [Lennard-Jones, EAM, MACE]
    repeatable: false
    notes:
    - >-
      Note: Give the functional form. The specific parameterization, e.g. an OpenKIM model, NIST IPR record,
      or a published potential file, is identified in the computation's software (role Interaction model).
  - name: architecture-parameter
    required: false
    description: A fixed variable that defines the architecture of the interatomic model.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    notes:
    - >-
      Note: For example, the number of layers, the number of nodes per layer, a cutoff radius or a maximum
      body order. Training settings are hyperparameter entries of training › training-method.
    subproperties:
    - name: name
      required: true
      description: The designation of the architecture parameter.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: value
      required: true
      description: The data associated with the architecture parameter.
      type: any
      extent: any
      kind: any
      recommended-unit: null
      values: null
      repeatable: false
    - name: unit
      required: false
      description: The unit in which the associated value is expressed.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
          only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
          (accepted with a validation warning).
      repeatable: false
      notes:
      - 'Note: Give it when the type of the value is float or int; omit it when it is string or bool.'
    - name: description
      required: false
      description: An explanation of the meaning, source, or purpose of the architecture parameter.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
  - name: particle-style
    required: true
    description: The nature of the discrete entities whose interactions the model describes.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Atom, Radical, United atom, Bead, Coarse grained, Mesoscale, Classical electron, Nucleus]
      note: |-
        - "Atom" – Each particle represents an individual atom
        - "Radical" – Each particle represents a free radical
        - "United atom" – Each particle represents a fixed grouping of atoms
        - "Bead" – Each particle represents a user-tuneable group of atoms
        - "Coarse grained" – Each particle represents a higher scale particle obtained by scaling up the atomic representation
        - "Mesoscale" – Granular particles used to simulate microstructure at the mesoscopic scale
        - "Classical electron" – Antisymmetrized wave packet representation of valence electrons
        - "Nucleus" – A nucleus or an ion core as a point charge, with its electrons represented by other particles, e.g. in the electron force field

        Give one entry for each kind of particle the model has, e.g. Nucleus and Classical electron for the electron force field.
    repeatable: true
  - name: bonding-type
    required: true
    description: Specifies whether the bonds between particles are immutable or can be broken.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Reactive, Bonded fixed, Bonded mutable]
      note: |-
        - "Reactive" – A model without a predetermined bonding topology in which bonds are formed or broken on-the-fly based on the particle environment
        - "Bonded fixed" – Bonds defined <i>a priori</i> and cannot be broken during a simulation
        - "Bonded mutable" – Bonds defined <i>a priori</i> but can be broken and/or formed during a simulation
    repeatable: false
  - name: charge-interaction
    required: false
    description: The model used to describe the interactions between charged particles.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: charge-origin
      required: true
      description: Nature of the particle charges.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Semi empirical, Quantum, Electronic population, Electronegativity, Tabulated]
        note: |-
          - "Semi empirical" – Charges obtained from semi-empirical quantum calculations
          - "Quantum" – Charges obtained from quantum calculations
          - "Electronic population" – Charges obtained from electronic population analysis, e.g. Mulliken
          - "Electronegativity" – Charges obtained from electronegativity differences between atoms
          - "Tabulated" – Charges obtained from an external source
      repeatable: false
    - name: charge-style
      required: true
      description: >-
        The nature of the charges associated with the particles, such as total or effective charges.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Coulomb full, Coulomb screened]
        note: |-
          - "Coulomb full" – The particle charge accounting for all electrons
          - "Coulomb screened" – Effective charge due to screening or shielding by other electrons (e.g. Slater)
      repeatable: false
    - name: charge-variability
      required: true
      description: >-
        Attribute specifying the method for dynamically varying the local electric charge associated with
        discrete entities.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Fixed, QEq, EEM, iEL/SCF, FlucQ, Drude]
        note: |-
          - "Fixed" – Charges cannot change during a simulation
          - "QEq" – Charge equilibration method
          - "EEM" – Electronegativity Equalization Method
          - "iEL/SCF" – Extended Lagrangian/self-consistent field scheme
          - "FlucQ" – Fluctuating charge potential
          - "Drude" – Drude method
      repeatable: false
    - name: electrostatic-summation
      required: false
      description: Method used to compute the electrostatic interactions between the charges.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [None, Direct, Short-range, Ewald, PME, PPPM, Reaction]
        note: |-
          - "None" – No electrostatic interactions are computed from the charges. A model whose particles carry no charges omits charge-interaction
          - "Direct" – All Coulomb interactions computed directly
          - "Short-range" – Electrostatic interactions computed only within a cutoff distance, possibly shifted or damped, e.g. Wolf summation or damped shifted force (DSF)
          - "Ewald" – Ewald summation
          - "PME" – Particle mesh Ewald
          - "PPPM" – Particle particle particle mesh
          - "Reaction" – Reaction field
      repeatable: false
    - name: electric-dipole
      required: false
      description: >-
        Attribute specifying the type of interaction associated with the local electric dipoles associated
        with particles.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Stockmayer, Screened, Long range]
        note: |-
          - "Stockmayer" – Stockmayer potential
          - "Screened" – Screened dipoles
          - "Long range" – Long-range dipoles
      repeatable: false
    - name: electric-dipole-variability
      required: false
      description: >-
        Attribute specifying the method for dynamically varying the local electric dipoles associated with
        discrete entities.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Induced, Isotropic, Anisotropic]
        note: |-
          - "Induced" – Induced point dipoles
          - "Isotropic" – Isotropic polarizability
          - "Anisotropic" – Anisotropic polarizability
      repeatable: false
  - name: magnetic-interaction
    required: false
    description: The model used to describe the interactions between magnetic spins.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: spin-style
      required: true
      description: The nature of the magnetic spins associated with the particles.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Classical spin, Coupled spin lattice]
        note: |-
          - "Classical spin" – Spins modeled as classical vectors evolved via the Landau–Lifshitz–Gilbert (LLG) equation defined by a spin Hamiltonian
          - "Coupled spin lattice" – Classical spins whose spin Hamiltonian depends on the particle positions, so that the spins and the particles evolve together

          Magnetism obtained from the electrons, e.g. by spin-polarized DFT or tight binding, is a computation of its own (method DFT or TB), which the computation that uses it names as an `input` with the role Interaction model.
      repeatable: false
    - name: magnetic-dipole
      required: false
      description: >-
        Attribute specifying the type of interaction (spin Hamiltonian) between the magnetic dipoles associated
        with particles.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        examples: [Heisenberg, Multi-spin, Zeeman]
      repeatable: false
      notes:
      - >-
        Note: The strength of an applied field is the condition `magnetic-field` in minimal `conditions`; a
        Zeeman term names its coupling to the spins.
  - name: training
    required: false
    description: How the interatomic model was fitted to data.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    notes:
    - >-
      Note: Give it for a computation whose task is Training. A computation that uses the trained model names this
      one in `input` with the role Parameters; a model trained elsewhere is given as software.
    subproperties:
    - name: training-data
      required: false
      description: The information used for parameterizing the interatomic model.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      subproperties:
      - name: name
        required: true
        description: Name of the training dataset used to train in the interatomic model.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: contents
        required: true
        description: Description of the information included in the training dataset.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. DFT calculations or experiments, and what one item of the data is (a structure, a
            configuration), since size counts items.
        repeatable: false
      - name: source
        required: false
        description: Location from which the training data was obtained.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            A MatCore ID, web address, DOI, citation, or other description of where the data was
            obtained. Training data produced by a computation of the record is not given here: the
            training computation names it in minimal `computation › input` with the role Training
            data.
        repeatable: false
      - name: size
        required: false
        description: Number of items in the training dataset.
        type: int
        extent: []
        kind: dimensionless
        recommended-unit: null
        values:
          minimum: 1
          note: >-
            The kind of item is stated in contents.
        repeatable: false
      - name: data-preprocessing
        required: false
        description: >-
          Approach used for preliminary refining of raw, unformatted, or incomplete information into a structured
          and clean state suitable for modeling or analysis.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: missing-data
        required: false
        description: >-
          Documentation of incomplete, null, or unrecorded entries within a feature set that hinder algorithm
          training.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. the percentage of missing data, and which fields are missing and why.
        repeatable: false
      - name: missing-data-strategy
        required: false
        description: >-
          Approach used for filling in or removing blank, null, or unknown entries in a dataset.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: outlier-handling
        required: false
        description: >-
          Approach to identifying and addressing extreme observations that deviate significantly from the
          general distribution to ensure they do not disproportionately skew model training.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: dataset-split
        required: false
        description: >-
          A description of how information used to train the interatomic model was divided into subsets
          as part of the training process.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            In words, e.g. a random split of 80/10/10 into training, validation and test sets, a split
            stratified by composition, or k-fold cross-validation.
        repeatable: false
    - name: training-method
      required: false
      description: The approach used to determine the interatomic model's free parameters.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: training-procedure
        required: true
        description: The methodology used to determine the interatomic model's free parameters.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. the optimizer (Adam, L-BFGS, closed-form least squares), the learning-rate schedule, the
            stopping rule, and any active-learning loop with its selection criterion (e.g. query by committee,
            an uncertainty threshold). Explain the role of each hyperparameter entry.
        repeatable: false
      - name: loss-function
        required: false
        description: The quantities fitted in training and how they are weighted.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. the mean squared error of formation energies, or a weighted sum of the errors in energies,
            forces and stresses with weights 1:100:10.
        repeatable: false
      - name: hyperparameter
        required: false
        description: A fixed variable that controls the fitting of the interatomic model.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: true
        notes:
        - >-
          Note: For example, the learning rate, the batch size, the number of epochs or the early-stopping
          patience. Numbers that fix the model's architecture are architecture-parameter entries of the settings.
        subproperties:
        - name: name
          required: true
          description: The designation of the hyperparameter.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values: null
          repeatable: false
        - name: value
          required: true
          description: The data associated with the hyperparameter.
          type: any
          extent: any
          kind: any
          recommended-unit: null
          values: null
          repeatable: false
        - name: unit
          required: false
          description: The unit in which the associated value is expressed.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            note: >-
              A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
              only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
              (accepted with a validation warning).
          repeatable: false
          notes:
          - 'Note: Give it when the type of the value is float or int; omit it when it is string or bool.'
        - name: description
          required: false
          description: An explanation of the meaning, source, or purpose of the hyperparameter.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values: null
          repeatable: false
      - name: transfer-learning
        required: false
        description: >-
          Method used to migrate knowledge from previously mastered objectives to accelerate proficiency for
          the current training.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. fine-tuning, domain adaptation, multi-task learning or delta learning, with the details of
            how it was applied.
        repeatable: false
    - name: model-performance
      required: false
      description: An assessment of the reliability of the results of the interatomic model.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      subproperties:
      - name: evaluation-method
        required: true
        description: >-
          A description of the approach used to determine the reliability of the obtained results of
          the interatomic model.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. a hold-out test set or k-fold cross-validation. Validation data serve to tune the model's
            hyperparameters or stop its training; test data, used for neither, assess it. The scores are metric
            entries.
        repeatable: true
      - name: metric
        required: false
        description: A score of the interatomic model on one subset of the data.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: true
        subproperties:
        - name: subset
          required: true
          description: The data on which the score was measured.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            terms: [Training, Validation, Test]
            note: |-
              - "Training" – The data the model's parameters were fitted to
              - "Validation" – Data used to tune hyperparameters or to stop training
              - "Test" – Data used in neither, which assesses the model
          repeatable: false
        - name: quantity
          required: true
          description: The target variable the score is for.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            examples: [Formation energy, Forces]
          repeatable: false
        - name: measure
          required: true
          description: The statistic used as the score.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            terms: [MAE, RMSE, R², Accuracy]
            note: |-
              - "MAE" – Mean absolute error
              - "RMSE" – Root-mean-square error
              - "R²" – Coefficient of determination
              - "Accuracy" – Fraction of correct predictions, for a classification
          repeatable: false
        - name: value
          required: true
          description: The value of the property, in the unit given by `unit`.
          type: float
          extent: []
          kind: any
          recommended-unit: null
          values: null
          repeatable: false
        - name: unit
          required: true
          description: The unit in which the associated value is expressed.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            note: >-
              A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and only
              if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression (accepted
              with a validation warning).
          repeatable: false
      - name: uncertainty-quantification
        required: false
        description: >-
          The method or process used to identify and measure the range of possible outcomes to assess the
          reliability of interatomic model predictions.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. Bayesian methods, dropout, ensemble methods or a Gaussian process. Say whether an uncertainty
            for each item is part of the dataset.
        repeatable: false
      - name: applicability-domain
        required: false
        description: Where the inputs the model is applied to lie relative to its training data.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            E.g. the elements, structure types or range of compositions the training data cover, and how inputs
            outside them were identified (a distance in feature space, an uncertainty threshold).
        repeatable: false
