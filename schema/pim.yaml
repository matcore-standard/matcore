section: pim
title: 2.3 Particle Interaction Model (PIM) Metadata
source: >-
  Moved from md.yaml by decision 0046 (particle-style, particle-interactions, charge-interactions and
  magnetic-interactions). legacy_* fields hold the baseline prose and are to be replaced by typed fields in
  subsequent PRs.
introduction: |
  The metadata for particle interaction models (MatCore-PIM) is tabulated below. A particle interaction model gives the energy and forces of a system of particles as an explicit function of the particles' coordinates, without solving for a wavefunction or an electron density, e.g. an interatomic potential, a machine-learned interatomic potential, a bonded force field, a coarse-grained model or the electron force field. These properties describe a computation whose method is PIM, the evaluation of energies and forces used by another computation, e.g. molecular dynamics. The properties are given in settings blocks, each naming the PIM computations it describes. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below.)
examples:
  - caption: PIM Method-Specific Metadata
    file: pim.json
    source: https://doi.org/10.6084/m9.figshare.6273170
legacy_complete: true
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: theory-level
    required: true
    description: How the functional form of the model was obtained.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Physics-based, Machine-learned]
      note: >-
        "Physics-based" – A functional form built from a physical model of the interactions, with parameters
        fitted to data, e.g. EAM, Tersoff, a bonded force field or the electron force field.
        "Machine-learned" – A machine learning model trained to take particle positions as input, e.g. GAP or
        MACE.
    repeatable: false
  - name: model-type
    required: true
    description: The kind of potential used to compute the particle interactions.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      examples: [Lennard-Jones, EAM, MACE]
    repeatable: false
    notes:
    - >-
      Note: Give the functional form. The specific parameterization, e.g. an OpenKIM model, NIST IPR record,
      or a published potential file, is identified in the computation's software (role Interaction model).
  - name: particle-style
    required: true
    description: The nature of the discrete entities whose interactions the model describes.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Atom, Radical, United atom, Bead, Coarse grained, Mesoscale, Classical electron, Nucleus]
      note: >-
        "Atom" – Each particle represents an individual atom. "Radical" – Each particle represents a free
        radical. "United atom" – Each particle represents a fixed grouping of atoms. "Bead" – Each particle
        represents a user-tuneable group of atoms. "Coarse grained" – Each particle represents a higher scale
        particle obtained by scaling up the atomic representation. "Mesoscale" – Granular particles used to
        simulate microstructure at the mesoscopic scale. "Classical electron" – Antisymmetrized wave packet
        representation of valence electrons. "Nucleus" – A nucleus or an ion core as a point charge, with its
        electrons represented by other particles, e.g. in the electron force field. Give one entry for each
        kind of particle the model has, e.g. Nucleus and Classical electron for the electron force field.
    repeatable: true
  - name: bonding-type
    required: true
    description: Specifies whether the bonds between particles are immutable or can be broken.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Reactive, Bonded fixed, Bonded mutable]
      note: >-
        "Reactive" – A model without a predetermined bonding topology in which bonds are formed or broken
        on-the-fly based on the particle environment. "Bonded fixed" – Bonds defined <i>a priori</i> and
        cannot be broken during a simulation. "Bonded mutable" – Bonds defined <i>a priori</i> but can be
        broken and/or formed during a simulation.
    repeatable: false
  - name: charge-interactions
    required: false
    description: The model used to describe the interactions between charged particles.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: charge-origin
      required: true
      description: Nature of the particle charges.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Semi empirical, Quantum, Electronic population, Electronegativity, Tabulated]
        note: >-
          "Semi empirical" – Charges obtained from semi-empirical quantum calculations. "Quantum" – Charges
          obtained from quantum calculations. "Electronic population" – Charges obtained from electronic
          population analysis, e.g. Mulliken. "Electronegativity" – Charges obtained from electronegativity
          differences between atoms. "Tabulated" – Charges obtained from an external source.
      repeatable: false
    - name: charge-style
      required: true
      description: >-
        The nature of the charges associated with the particles, such as total or effective charges.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Coulomb full, Coulomb screened]
        note: >-
          "Coulomb full" – The particle charge accounting for all electrons. "Coulomb screened" – Effective
          charge due to screening or shielding by other electrons (e.g. Slater).
      repeatable: false
    - name: charge-variability
      required: true
      description: >-
        Attribute specifying the method for dynamically varying the local electric charge associated with
        discrete entities.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Fixed, QEq, EEM, iEL/SCF, FlucQ, Drude]
        note: >-
          "Fixed" – Charges cannot change during a simulation. "QEq" – Charge equilibration method. "EEM" –
          Electronegativity Equalization Method. "iEL/SCF" – Extended Lagrangian/self-consistent field scheme.
          "FlucQ" – Fluctuating charge potential. "Drude" – Drude method.
      repeatable: false
    - name: long-range-electrostatics
      required: false
      description: Method used to compute long-range electrostatic interactions.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [None, Direct, Ewald, PME, PPPM, Reaction]
        note: >-
          "None" – No electrostatic calculation performed. "Direct" – All Coulomb interactions computed
          directly. "Ewald" – Ewald summation. "PME" – Particle mesh Ewald. "PPPM" – Particle particle particle
          mesh. "Reaction" – Reaction field.
      repeatable: false
    - name: electric-dipole
      required: false
      description: >-
        Attribute specifying the type of interaction associated with the local electric dipoles associated
        with particles.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Stockmayer, Screened, Long range]
        note: >-
          "Stockmayer" – Stockmayer potential. "Screened" – Screened dipoles. "Long range" – Long-range dipoles.
      repeatable: false
    - name: electric-dipole-variability
      required: false
      description: >-
        Attribute specifying the method for dynamically varying the local electric dipoles associated with
        discrete entities.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Induced, Isotropic, Anisotropic]
        note: >-
          "Induced" – Induced point dipoles. "Isotropic" – Isotropic polarizability. "Anisotropic" –
          Anisotropic polarizability.
      repeatable: false
  - name: magnetic-interactions
    required: false
    description: The model used to describe the interactions between magnetic spins.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: spin-style
      required: true
      description: The nature of the magnetic spins associated with the particles.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Classical spin, Coupled spin lattice]
        note: >-
          "Classical spin" – Spins modeled as classical vectors evolved via the Landau–Lifshitz–Gilbert (LLG)
          equation defined by a spin Hamiltonian. "Coupled spin lattice" – Classical spins whose spin
          Hamiltonian depends on the particle positions, so that the spins and the particles evolve together.
          Magnetism obtained from the electrons, e.g. by spin-polarized DFT or tight binding, is a computation
          of its own (method DFT or TB), which the computation that uses it names as an `input` with the role
          Interaction model.
      repeatable: false
    - name: magnetic-dipole
      required: false
      description: >-
        Attribute specifying the type of interaction (spin Hamiltonian) between the magnetic dipoles associated
        with particles.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        examples: [Heisenberg, Multi-spin, Zeeman]
      repeatable: false
      notes:
      - >-
        Note: The strength of an applied field is the condition `magnetic-field` in minimal `conditions`; a
        Zeeman term names its coupling to the spins.
