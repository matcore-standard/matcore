        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: value
        required: true
        description: The data associated with the model parameter.
        type: any
        extent: any
        kind: any
        recommended-unit: null
        values: null
