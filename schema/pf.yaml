section: pf
title: 2.7 Phase Field (PF) Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The metadata for Phase Field (PF) data (MatCore-PF) is tabulated below. This metadata documents key aspects of the PF method to provide understanding of the dataset generated by it. This includes the fundamental mathematical and physical framework governing the PF simulation, including the governing equations and thermodynamic free energy models. The properties are given in settings blocks, each naming the PF computations it describes. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below.)
examples:
  - caption: PF Method-Specific Metadata
    file: pf.json
    source: https://zenodo.org/records/7319845
legacy_complete: true
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: physical-phenomenon
    required: true
    description: >-
      Material process being modeled; description of the overarching processes and mechanisms being modeled/simulated.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Isothermal solidification, Directional solidification, Isothermal annealing, Sintering, Twinning,
        Grain growth, Spinodal decomposition, Fracture, Plasticity]
      note: >-
        "Isothermal solidification" – Growth of a solid from a melt or solution held at one uniform temperature,
        e.g. dendrites growing into an undercooled melt. "Directional solidification" – Solidification in an
        imposed temperature gradient, the front advancing along it, e.g. cellular or dendritic growth in a
        pulled sample. "Isothermal annealing" – Evolution of a solid microstructure held at one temperature,
        e.g. recovery, recrystallization or precipitate coarsening. "Sintering" – Bonding and densification of
        particles by diffusion below their melting point. "Twinning" – Formation or growth of twins, domains
        whose lattice is the mirror image of the parent's across a twin plane. "Grain growth" – Coarsening of a
        polycrystal by grain-boundary migration, driven by the reduction of grain-boundary energy. "Spinodal
        decomposition" – Phase separation of an unstable solution by the growth of composition fluctuations,
        without a nucleation barrier. "Fracture" – Initiation and propagation of cracks, a phase field marking
        the broken material. "Plasticity" – Irreversible deformation, e.g. by dislocation motion, described
        by phase fields or coupled to the phase field model.
    repeatable: true
    notes:
    - 'Note: Give one entry for each process modeled.'
  - name: problem-specification
    required: true
    description: >-
      The fundamental mathematical and physical framework governing the phase field simulation, including
      the governing equations and thermodynamic free energy models.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    subproperties:
    - name: governing-equation
      required: true
      description: The specific phase field equation used to evolve a field variable.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - 'Note: Give one entry for each equation. Equations solved together form a coupled model.'
      subproperties:
      - name: type
        required: true
        description: The mathematical classification of the phase field equation.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [CH, AC, GP, FID, PFC, Navier-Stokes, Multi-phase-field, Mechanical equilibrium, Poisson]
          note: >-
            "CH" – Cahn-Hilliard: a conserved field evolves by a flux driven by the gradient of the
            variational derivative of the free energy. "AC" – Allen-Cahn: a nonconserved field relaxes at a
            rate proportional to the variational derivative of the free energy. "GP" – Grand potential: the
            phase fields evolve with the grand potential, the chemical potentials being the diffusion
            variables instead of the concentrations. "FID" – Finite interface dissipation: each phase has its
            own concentration within the interface, and the phases exchange solute at a finite rate. "PFC" –
            Phase field crystal: a conserved field periodic on the atomic scale resolves the crystal lattice
            and its defects. "Navier-Stokes" – The flow of a fluid phase; the evolved variable is the
            velocity. "Multi-phase-field" – Several phase fields, one for each phase or grain, constrained to
            sum to one. "Mechanical equilibrium" – The balance of stresses; the evolved variable is the
            displacement. "Poisson" – Electrostatics; the evolved variable is the electric potential.
        repeatable: true
        notes:
        - >-
          Note: Give one entry for each classification that applies, e.g. AC and Multi-phase-field. Give an
          anti-trapping current, or a sharp- or thin-interface formulation, as a user-specified value.
      - name: evolved-variable
        required: true
        description: The name of the field-variable being evolved by this equation.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          examples: [phi, c]
          note: >-
            The `name` of a field variable defined in `variables › field-variable` of the same settings
            block.
        repeatable: false
      - name: free-energy-density-term
        required: false
        description: A term of the free energy density that drives this equation.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          examples: [f_chem, f_elastic]
          note: >-
            The `name` of a term defined in `problem-specification › free-energy-density` of the same
            settings block.
        repeatable: true
    - name: free-energy-density
      required: true
      description: A term of the thermodynamic free energy density used in the simulation.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - 'Note: Give one entry for each term, e.g. a chemical, an interfacial and an elastic term.'
      subproperties:
      - name: name
        required: true
        description: The identifier or symbol used for this specific energy functional.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          examples: [f_chem, Chemical Free Energy]
        repeatable: false
      - name: contribution
        required: false
        description: The physical contribution to the free energy that this term represents.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Chemical, Interfacial, Elastic, Plastic, Electrical, Magnetic, Fluid-solid interaction, Solid-solid
              interaction]
          note: >-
            "Chemical" – The bulk free energy of the phases as a function of composition and temperature.
            "Interfacial" – The energy of interfaces, from the gradient terms and the barrier between phases.
            "Elastic" – The elastic strain energy. "Plastic" – The energy stored by plastic deformation.
            "Electrical" – The energy of charges, polarization and electric fields. "Magnetic" – The energy of
            magnetization and magnetic fields. "Fluid-solid interaction" – The energy of the coupling between a
            fluid and a solid. "Solid-solid interaction" – The energy of the coupling between solid phases or
            grains.
        repeatable: true
        notes:
        - 'Note: A term that combines several contributions gives one entry for each.'
      - name: description
        required: true
        description: The type/derivation of the thermodynamic bulk free energy function.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Ideal, Regular, Flory, Calphad, Poly, Non-polynomial]
          note: >-
            "Ideal" – Ideal solution: the entropy of ideal mixing, with no interaction energy. "Regular" –
            Regular solution: ideal mixing with an interaction energy. "Flory" – Flory-Huggins: the free energy
            of mixing of polymer solutions or blends. "Calphad" – Gibbs energies from a CALPHAD thermodynamic
            database. "Poly" – A polynomial in the field variables, e.g. a double well or a Landau expansion.
            "Non-polynomial" – Any other closed-form function of the field variables.
        repeatable: false
      - name: expression
        required: false
        description: The mathematical expression of the free energy density.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: A code snippet, LaTeX formula, or SymPy expression.
        repeatable: false
      - name: unit
        required: false
        description: The physical unit of the free energy density.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
            only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
            (accepted with a validation warning).
        repeatable: false
  - name: domain
    required: false
    description: The spatial configuration of the computational region and its boundaries.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    subproperties:
    - name: dimensionality
      required: true
      description: The spatial dimensions of the computational domain.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [1D, 2D, 3D]
      repeatable: false
    - name: coordinate-system
      required: false
      description: >-
        The structured framework used to uniquely determine and standardize the position of the points in
        space and the symmetry assumed.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Cartesian, Cylindrical, Spherical]
      repeatable: false
    - name: domain-size
      required: false
      description: Specification of the computational region extents.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      notes:
      - 'Note: Give one extent for each coordinate direction, in the order of the coordinates.'
      - >-
        Note: `unit` is a Length symbol from Annex U, or `dimensionless` when the simulation uses reduced
        units; the characteristic length is then given as a `variables › model-parameter` entry, so the
        extents can be converted.
      - >-
        Note: For a regular domain the extents are its size. For an irregular geometry, whose mesh is given in
        `numerical-method › mesh-file`, they may give a characteristic size of the structure.
      subproperties:
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: [':']
        kind: Length
        recommended-unit: m
        values:
          minimum: 0
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: boundary-conditions
      required: false
      description: A constraint applied on a boundary of the computational domain.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: Give one entry for each condition. An entry without `boundary` applies to every boundary, and one
        without `field-variable` to every field variable.
      subproperties:
      - name: type
        required: true
        description: The kind of boundary condition.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Dirichlet, Neumann, Zero-Neumann, Periodic]
          note: >-
            "Dirichlet" – The value of the field variable is prescribed on the boundary, e.g. a fixed
            concentration or a clamped displacement. "Neumann" – The normal derivative of the field variable
            (its flux) is prescribed on the boundary. "Zero-Neumann" – The normal derivative is zero: no flux
            crosses the boundary, or a surface is free of traction. "Periodic" – Opposite boundaries are
            identified, so the field variable repeats across them.
        repeatable: false
      - name: boundary
        required: false
        description: The boundary on which the condition applies.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            The name of a boundary in the mesh file (`numerical-method › mesh-file` of the same settings block),
            or a description such as "x = 0".
        repeatable: false
      - name: field-variable
        required: false
        description: The field variable that the condition constrains.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            The `name` of a field variable defined in `variables › field-variable` of the same settings
            block.
        repeatable: false
    - name: initial-conditions
      required: false
      description: The spatial distribution of the field variables at the start of the simulation.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        examples: [Uniform constant, Random noise, Geometric seed, Imported array]
        note: >-
          A mathematical function, or a state produced by an algorithm or given as a spatial distribution, is
          described in words.
      repeatable: true
  - name: numerical-method
    required: true
    description: >-
      A description of the computational framework used to solve the phase field equations.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    subproperties:
    - name: evolved-variable
      required: false
      description: The field variable evolved by an equation that this entry solves.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          The `name` of a field variable defined in `variables › field-variable` of the same settings block,
          evolved by one of the `problem-specification › governing-equation` entries.
      repeatable: true
      notes:
      - >-
        Note: Give it when equations are solved by different methods or solvers, one `numerical-method` entry for
        each group, each naming the variables its equations evolve. Omit it when one entry covers every
        equation.
    - name: spatial-discretization
      required: true
      description: >-
        The numerical approach used to convert continuous governing equations into a system of algebraic
        equations defined over a discrete mesh or set of points within the computational domain.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [FDM, FEM, FVM, LBM, Particle, Spectral]
        note: >-
          "FDM" – Finite Difference Method: derivatives are approximated by differences of the values at grid
          points. "FEM" – Finite Element Method: the fields are expanded in basis functions on elements, and the
          equations are imposed in weak form. "FVM" – Finite Volume Method: the equations are integrated over
          control volumes, balancing the fluxes across their faces. "LBM" – Lattice Boltzmann Method:
          distribution functions are streamed and collided on a lattice. "Particle" – The fields are carried by
          moving particles or points, e.g. smoothed particle hydrodynamics or the material point method.
          "Spectral" – The fields are expanded in global basis functions, e.g. Fourier modes evaluated by fast
          Fourier transforms.
      repeatable: false
    - name: spatial-discretization-parameter
      required: false
      description: A parameter of the spatial discretization.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: For example, the element degree, the quadrature rule or the finite-difference stencil. The grid
        spacing is given in `grid-spacing`.
      subproperties:
      - name: name
        required: true
        description: The designation of the spatial discretization parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: value
        required: true
        description: The data associated with the spatial discretization parameter.
        type: any
        extent: any
        kind: any
        recommended-unit: null
        values: null
        repeatable: false
      - name: unit
        required: true
        description: The unit in which the associated value is expressed.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          note: >-
            A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
            only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
            (accepted with a validation warning).
        repeatable: false
      - name: description
        required: false
        description: An explanation of the meaning, source, or purpose of the spatial discretization parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: spatial-accuracy-order
      required: false
      description: >-
        The exponent of the grid spacing parameter (Δx) determining the rate at which the discretization
        error approaches zero as the mesh is refined.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
      repeatable: false
    - name: mesh-type
      required: false
      description: The topology or distribution of the discrete grid points.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Regular, Rectilinear, Skewed, Curvilinear, Unstructured, Adaptive mesh refinement, Meshless]
        note: >-
          "Regular" – A structured grid with uniform spacing along each axis. "Rectilinear" – A structured grid
          of axis-aligned cells whose spacing varies along an axis. "Skewed" – A structured grid whose axes are
          not orthogonal. "Curvilinear" – A structured grid whose lines follow curved coordinates, e.g. fitted to
          a boundary. "Unstructured" – Cells of arbitrary connectivity, e.g. triangles or tetrahedra. "Adaptive
          mesh refinement" – A grid refined and coarsened locally during the simulation, e.g. at interfaces.
          "Meshless" – Points without connectivity, as in particle methods.
      repeatable: false
    - name: mesh-file
      required: false
      description: >-
        A file holding the mesh or part of it, such as its structure or the boundaries on which the boundary
        conditions apply.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: Give it for a mesh that `mesh-type`, `grid-spacing` and `domain › domain-size` do not fix, e.g. an
        unstructured mesh of an irregular geometry. Its named boundaries are those that
        `domain › boundary-conditions › boundary` refers to.
      - >-
        Note: Give one entry for each file, e.g. the mesh structure and its boundaries when they are stored
        separately.
      subproperties:
      - name: name
        required: true
        description: The file name.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: description
        required: true
        description: A brief description of the file and its contents.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: contents
        required: false
        description: >-
          The contents of the file: its text, or its bytes encoded as given in encoding. Not required in case
          a link to the file is provided instead.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: encoding
        required: false
        description: How contents is encoded.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          terms: [Base64]
        repeatable: false
        notes:
        - >-
          Note: Without encoding, contents is the file's text. With Base64, contents is the file's bytes
          encoded as Base64 (RFC 4648); use it for a binary file, or for a text file whose exact bytes matter.
      - name: link
        required: false
        description: A URI pointing to a permanent location of the file online.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          format: uri
        repeatable: false
      - name: checksum
        required: true
        description: A digital fingerprint of the file, computed by a named algorithm.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: true
        subproperties:
        - name: algorithm
          required: true
          description: The algorithm that computed the checksum.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            terms: [SHA1, SHA224, SHA256, SHA384, SHA512, SHA3-256, SHA3-384, SHA3-512, BLAKE2b-256, BLAKE2b-384,
              BLAKE2b-512, BLAKE3, MD2, MD4, MD5, MD6, ADLER32]
            note: >-
              The algorithm names of [SPDX 2.3.1 §8.4](https://spdx.github.io/spdx-spec/v2.3.1/file-information/)
              (File checksum field).
          repeatable: false
        - name: value
          required: true
          description: The checksum of the file, in lowercase hexadecimal digits.
          type: string
          extent: []
          kind: inapplicable
          recommended-unit: null
          values:
            pattern: '[0-9a-f]+'
          repeatable: false
    - name: temporal-discretization
      required: false
      description: >-
        The algorithm, step-size approach, and integration order used to advance a simulation, governing
        equation in time.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Forward Euler, Backward Euler, Adams-Bashforth, Crank-Nicolson, Runge-Kutta, IMEX]
        note: >-
          "Forward Euler" – First-order explicit: the rate is evaluated at the start of the step. "Backward
          Euler" – First-order implicit: the rate is evaluated at the end of the step. "Adams-Bashforth" – An
          explicit multistep scheme: the rate is extrapolated from previous steps. "Crank-Nicolson" –
          Second-order implicit: the rate is averaged over the start and the end of the step. "Runge-Kutta" – A
          multistage scheme: the rate is evaluated at intermediate points of the step, explicitly or implicitly.
          "IMEX" – Implicit-explicit: stiff terms are treated implicitly and the rest explicitly, e.g. a
          semi-implicit spectral scheme.
      repeatable: false
      notes:
      - 'Note: Omit it for a stationary problem, which is solved without time integration.'
    - name: temporal-accuracy-order
      required: false
      description: >-
        The exponent of the time step parameter (Δt) determining the rate at which the discretization error
        approaches zero as the time step tends to zero.
      type: int
      extent: []
      kind: dimensionless
      recommended-unit: null
      values:
        minimum: 1
      repeatable: false
    - name: grid-spacing
      required: false
      description: >-
        Defines the distance between adjacent discretization points in a numerical domain.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: `unit` is a Length symbol from Annex U, or `dimensionless` when the simulation uses reduced
        units; the characteristic length is then given as a `variables › model-parameter` entry, so the
        values can be converted.
      subproperties:
      - name: name
        required: true
        description: The designation of the grid spacing parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          examples: [dx, dy, dz, min, max, average]
        repeatable: false
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: Length
        recommended-unit: m
        values:
          minimum: 0
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: description
        required: false
        description: An explanation providing further clarification on the grid spacing parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: time-step-size
      required: false
      description: >-
        The discrete duration of progression between consecutive stages of a simulation, determining the
        interval for numerical integration, resolution of transient phenomena, and stability of the governing
        equations.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      notes:
      - >-
        Note: `unit` is a Time symbol from Annex U, or `dimensionless` when the simulation uses reduced
        units; the characteristic time is then given as a `variables › model-parameter` entry, so the
        values can be converted.
      subproperties:
      - name: name
        required: true
        description: The designation of the time step size parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values:
          examples: [dt, initial, min, max]
        repeatable: false
      - name: value
        required: true
        description: The value of the property, in the unit given by `unit`.
        type: float
        extent: []
        kind: Time
        recommended-unit: s
        values:
          minimum: 0
        repeatable: false
      - name: unit
        required: true
        description: The unit of the value, an Annex U symbol whose Kind is the Kind of `value`.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
      - name: description
        required: false
        description: An explanation providing further clarification on the time step size parameter.
        type: string
        extent: []
        kind: inapplicable
        recommended-unit: null
        values: null
        repeatable: false
    - name: solver
      required: false
      description: A numerical algorithm used to solve the discretized equations.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        terms: [Explicit, Direct, Conjugate gradient, BiCGSTAB, GMRES, Multigrid, Newton, Newton-Krylov, Picard]
        note: >-
          "Explicit" – No system of equations is solved; the update is computed directly. "Direct" – A linear
          system is solved by factorization, e.g. LU or Cholesky. "Conjugate gradient" – A Krylov method for
          symmetric positive-definite linear systems. "BiCGSTAB" – Biconjugate gradient stabilized, a Krylov
          method for nonsymmetric linear systems. "GMRES" – Generalized minimal residual, a Krylov method for
          nonsymmetric linear systems. "Multigrid" – A linear solver or preconditioner that corrects the error on
          a hierarchy of coarser grids. "Newton" – Newton's method for a nonlinear system, each iteration solving
          a linear system. "Newton-Krylov" – Newton's method whose linear systems are solved by a Krylov method,
          often without forming the Jacobian. "Picard" – Fixed-point iteration of a nonlinear system, the
          nonlinear terms taken from the previous iterate.
      repeatable: true
      notes:
      - >-
        Note: Give one entry for each layer of the solution, e.g. Newton, GMRES, and Multigrid as its
        preconditioner. The library or code that provides a solver is given as the computation's software.
  - name: variables
    required: false
    description: >-
      Explicit data structure capturing changing and unchanging elements of the physics model.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    subproperties:
