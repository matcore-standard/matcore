# JSON Schema (written in YAML) that every schema/<section>.yaml file must satisfy. Validated in CI by scripts/validate_schema.py.
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://matcore.org/schema/meta-schema"
title: MatCore section schema
type: object
required: [section, title, properties]
additionalProperties: false
properties:
  section: {type: string, pattern: "^[a-z][a-z0-9-]*$"}
  title: {type: string}
  source: {type: string}
  introduction: {type: string}  # Markdown shown under the section title (0004 item 23)
  examples:                     # example instances shown at the end of the section page (0004 item 23)
    type: array
    items:
      type: object
      required: [caption, file, source]
      additionalProperties: false
      properties:
        caption: {type: string}
        file: {type: string, pattern: "^[a-z0-9-]+\\.json$"}  # a JSON file in examples/ (0044)
        source: {type: string}                             # the dataset the example documents
        notes: {type: string}
  legacy_complete: {type: boolean}  # true once no legacy_* field remains in the section (0004 item 36)
  properties:
    type: array
    items: {$ref: "#/$defs/property"}
$defs:
  value-keys:
    # the keys of a property's values, or of one case of them (decision 0013)
    properties:
      terms: {type: array, items: {type: string}}  # open vocabulary
      enum: {type: array, items: {type: string}}   # closed list
      minimum: {type: number}
      maximum: {type: number}
      format: {type: string}
      pattern: {type: string}
      examples: {type: array}
      note: {type: string}
  property:
    type: object
    required: [name, required, description, repeatable]
    additionalProperties: false
    properties:
      name: {type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"}  # words joined by single hyphens (0004 item 13)
      required: {type: boolean}
      repeatable: {type: boolean}
      description: {type: string}
      # --- typed fields (null during baseline migration; filled by later PRs; see CLAUDE.md) ---
      type:
        enum: [string, float, int, bool, file, any, null]
      extent:
        # KIM-style: [] scalar, [3,3] fixed, [":"] open length ("any" = shape fixed by the instance or by a required enumerated subproperty)
        oneOf:
          - type: "null"
          - const: any
          - type: array
            items: {oneOf: [{type: integer, minimum: 1}, {const: ":"}]}
      kind:
        # a key of units.yaml#kinds, or a reserved kind
        oneOf: [{type: "null"}, {type: string, pattern: "^([A-Z][A-Za-z]+|dimensionless|inapplicable|any)$"}]
      recommended-unit:
        oneOf: [{type: "null"}, {type: string}]
      values:
        # allowed values / constraints / examples (structured); null if none (decision 0013)
        oneOf:
          - type: "null"
          - type: object
            $ref: "#/$defs/value-keys"
            properties:
              # values that depend on a sibling's value (0013, settled 2026-11-03)
              depends-on: {type: string}
              cases: {type: object, additionalProperties: {type: object, $ref: "#/$defs/value-keys", unevaluatedProperties: false}}
            dependentRequired: {depends-on: [cases], cases: [depends-on]}
            unevaluatedProperties: false
      convention:
        # required enumerated convention subproperty, e.g. {name: convention, enum: [2pi-included, 2pi-excluded]}
        oneOf: [{type: "null"}, {type: object, required: [name, enum], properties: {name: {type: string}, enum: {type: array, items: {type: string}}}}]
      notes: {type: array, items: {type: string}}
      # --- legacy prose from the Google Doc baseline; removed once typed fields are filled ---
      legacy_values: {type: string}
      legacy_unit: {type: string}
      subproperties:
        type: array
        items: {$ref: "#/$defs/property"}
