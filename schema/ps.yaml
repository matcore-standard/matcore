section: ps
title: 2.4 Particle Simulation (PS) Metadata
source: >-
  Migrated mechanically from MatCore_Dev.docx (Google Doc export). legacy_* fields hold the original prose
  and are to be replaced by typed fields in subsequent PRs.
introduction: |
  The metadata for particle simulations (MatCore-PS) is tabulated below. A particle simulation moves or samples a system of particles using the energies and forces supplied by an interaction model, a particle interaction model or, as in ab initio molecular dynamics, an electronic structure computation. This category includes molecular dynamics (MD), molecular statics (MS), Monte Carlo (MC) and their coarse-grained forms: energy and free energy minimization, equilibrium and nonequilibrium MD, accelerated dynamics, enhanced sampling, saddle-point searches and related approaches. The properties are given in settings blocks, each naming the PS computations it describes. (Note: This standard inherits the metadata in the minimal MatCore standard, adding the properties below.)
examples:
  - caption: PS Method-Specific Metadata
    file: ps.json
    source: https://doi.org/10.6084/m9.figshare.6273170
properties:
- name: settings
  required: true
  description: Settings shared by the computations named in it.
  type: null
  extent: null
  kind: null
  recommended-unit: null
  values: null
  repeatable: true
  subproperties:
  - name: computation-label
    required: true
    description: The label of a computation these settings apply to.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: true
  - name: algorithm
    required: true
    description: A procedure by which the computation moves or samples the particles.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values:
      terms: [Leap frog, Runge-Kutta, Velocity Verlet, Verlet, Hyperdynamics, Parallel replica dynamics, TAD,
        Simplex, Damped dynamics, FIRE, Steepest descent, Conjugate gradients, BFGS, NEB, String method,
        Dimer method, ART, Eigenvector following, Simulated annealing, SGLD, Basin hopping, Basin filling,
        Random structure search, Evolutionary algorithm, Particle swarm optimization, Minima hopping,
        Metropolis Monte Carlo, Hybrid Monte Carlo, Harmonic, Metadynamics, Thermodynamic integration,
        Umbrella sampling, Replica exchange, Steered MD, Targeted MD, aMD, Forward flux sampling,
        Transition path sampling, Milestoning]
      note: |-
        **Molecular dynamics, time integration**

        - "Leap frog" – Positions and velocities advanced at times offset by half a time step
        - "Runge-Kutta" – The equations of motion integrated by a Runge-Kutta scheme, which evaluates the forces at several points within each time step
        - "Velocity Verlet" – Positions, velocities and forces advanced to the same times, the velocities in two half steps
        - "Verlet" – Positions advanced from those at the two previous time steps, without explicit velocities

        **Molecular dynamics, accelerated**

        - "Hyperdynamics" – A bias potential that raises the energy wells but vanishes near the dividing surfaces between states, so that the sequence of transitions is preserved and the simulated time is boosted
        - "Parallel replica dynamics" – Copies of the system run in parallel from one state, the first transition found being accepted and the simulated time summed over the copies
        - "TAD" – Temperature-Accelerated Dynamics: transitions found at a high temperature and their times extrapolated to the temperature of interest by harmonic transition state theory

        **Molecular statics, local minimization**

        - "Simplex" – The downhill simplex method of Nelder and Mead, which uses energies only
        - "Damped dynamics" – Dynamics with friction or velocity quenching, which removes kinetic energy until the system comes to rest at a minimum
        - "FIRE" – Fast Inertial Relaxation Engine: damped dynamics that turns the velocity toward the force and adapts the time step
        - "Steepest descent" – Steps along the force
        - "Conjugate gradients" – Line minimizations along directions conjugate to the previous ones
        - "BFGS" – Broyden-Fletcher-Goldfarb-Shanno: a quasi-Newton method that builds an approximate inverse Hessian from successive forces, including its limited-memory form L-BFGS

        **Molecular statics, saddle points and paths**

        - "NEB" – Nudged Elastic Band: a chain of images between two minima, joined by springs and relaxed to the minimum energy path, including its climbing-image form
        - "String method" – A path between two minima represented as a curve, moved along the force perpendicular to it and reparameterized until it is the minimum energy path
        - "Dimer method" – A saddle point reached from a minimum by following the lowest curvature mode, estimated from a pair of nearby images using forces only
        - "ART" – Activation-Relaxation Technique: a saddle point reached by pushing the system out of its basin, followed by relaxation into a new minimum
        - "Eigenvector following" – Steps along the eigenvectors of the Hessian, uphill along one and downhill along the others, to a saddle point

        **Global optimization**

        - "Simulated annealing" – A temperature lowered gradually during dynamics or Monte Carlo, so that the system settles in a low minimum
        - "SGLD" – Stochastic Gradient Langevin Dynamics: Langevin dynamics with stochastically estimated gradients, used to explore and minimize
        - "Basin hopping" – Random moves, each followed by a local minimization, accepted by a Metropolis criterion on the minimized energies
        - "Basin filling" – Penalty functions added to the energy around the current minimum until the system escapes over the lowest saddle point, mapping minima and the barriers between them
        - "Random structure search" – Candidates generated at random within given constraints, each relaxed to a local minimum
        - "Evolutionary algorithm" – Candidates produced from earlier ones by heredity and mutation and selected by their energies, each relaxed to a local minimum
        - "Particle swarm optimization" – Candidates moved through configuration space toward the best structures found by each candidate and by the swarm, each relaxed to a local minimum
        - "Minima hopping" – A walk from one local minimum to the next by short molecular dynamics escapes, with an energy threshold for accepting a new minimum and a record of the minima already visited

        **Monte Carlo**

        - "Metropolis Monte Carlo" – Random trial moves accepted with the Metropolis probability, which samples the Boltzmann distribution
        - "Hybrid Monte Carlo" – Trial moves made by short molecular dynamics trajectories, accepted by a Metropolis criterion on the total energy

        **Enhanced sampling and free energy**

        - "Harmonic" – A free energy from the harmonic or quasi-harmonic approximation
        - "Metadynamics" – A history-dependent bias, built from Gaussians deposited along chosen collective variables, that drives the system away from states already visited and gives the free energy
        - "Thermodynamic integration" – A free energy difference from the integral of the average derivative of the energy along a coupling parameter
        - "Umbrella sampling" – Sampling in windows along a collective variable, each restrained by a bias potential, combined by reweighting into a free energy profile
        - "Replica exchange" – Copies of the system at different temperatures or Hamiltonians, whose configurations are exchanged by a Metropolis criterion
        - "Steered MD" – An external force or moving restraint applied along a collective variable to drive a transition
        - "Targeted MD" – A time-dependent constraint that drives the system toward a target configuration
        - "aMD" – Accelerated Molecular Dynamics: a boost added to the potential where the energy is below a threshold, averages being recovered by reweighting

        **Path sampling**

        - "Forward flux sampling" – Trajectories fired from a series of interfaces between two states, the rate being the product of the probabilities of reaching each next interface
        - "Transition path sampling" – Monte Carlo sampling of the ensemble of trajectories that connect two states, e.g. by shooting and shifting moves
        - "Milestoning" – Short trajectories between milestones along a reaction coordinate, combined to give the kinetics of the whole transition
    repeatable: true
    notes:
    - >-
      Note: Give one entry for each procedure used, e.g. Velocity Verlet and Hyperdynamics, or Random structure
      search and BFGS for a search that relaxes its candidates. How a thermodynamic constraint is enforced, e.g. a
      thermostat, a barostat or grand canonical Monte Carlo moves, is given in `thermodynamic-constraint`, not
      here.
    - >-
      Note: Numerical parameters of a procedure, e.g. the time step of Velocity Verlet or the number of images of
      NEB, are given as `computation-parameter` entries; its variant, e.g. well-tempered metadynamics, and other
      specifics are given in `description`.
  - name: description
    required: false
    description: Further information on the algorithms of these settings, e.g. the variant used, and an
      explanation of their computation-parameter entries.
    type: string
    extent: []
    kind: inapplicable
    recommended-unit: null
    values: null
    repeatable: false
  - name: computation-parameter
    required: false
    description: A fixed variable associated with the specified computation algorithm.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    notes:
    - >-
      Note: For example, the time step of Velocity Verlet, the simulation time of a dynamics run, the convergence
      tolerance of an energy minimization, the number of images of NEB, or, for a structure search, the number of
      candidates, the number of atoms per cell, the allowed space groups, the volume range and the force and
      energy tolerances of the local relaxations.
    subproperties:
    - name: name
      required: true
      description: The designation of the parameter associated with the specified computation algorithm.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
    - name: value
      required: true
      description: The data associated with the computation parameter.
      type: any
      extent: any
      kind: any
      recommended-unit: null
      values: null
      repeatable: false
    - name: unit
      required: true
      description: The unit in which the associated value is expressed.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values:
        note: >-
          A symbol from the MatCore Unit Table (Annex U), or the reserved symbol `dimensionless`. If and
          only if no Annex U symbol applies, a string prefixed `x-gnu:` giving a GNU Units expression
          (accepted with a validation warning).
      repeatable: false
    - name: description
      required: false
      description: An explanation of the meaning, source, or purpose of the computation parameter.
      type: string
      extent: []
      kind: inapplicable
      recommended-unit: null
      values: null
      repeatable: false
  - name: initialization
    required: false
    description: Information on the conditions set at the start of the simulation.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: false
    legacy_values: >-
      String containing a description of the simulation initial conditions (such as the nature and source
      of an initial structure, initialization of velocities or spins, etc.).
  - name: thermodynamic-constraint
    required: false
    description: >-
      Macroscopic physical restriction imposed on the simulation, such as a statistical mechanics ensemble.
    type: null
    extent: null
    kind: null
    recommended-unit: null
    values: null
    repeatable: true
    legacy_values: Contains SubProperties as listed below.
    subproperties:
    - name: system
      required: true
      description: The collection of particles to which the constraint is applied.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        String describing the constrained system (e.g. entire system, or a subset of atoms that are constrained.)
    - name: type
      required: true
      description: The nature of the imposed thermodynamic constraint.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        String containing one of the following values: "NVE" – Microcanonical "NVT" – Canonical "μVT" –
        Grand canonical "NPT" – Isothermal-isobaric "NσT" – Isothermal-isostress "μPT" – Grand isothermal-isobaric
        "μσT" – Grand isothermal-isostress "NPH" – Isoenthalpic-isobaric "NσH" – Isoenthalpic-isostress
        Other user-specified value if none of the above apply.
    - name: method
      required: false
      description: The name of the approach used to impose the constraint.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: >-
        String containing one of the following values based on the specified constraint:: For "NVT": "Andersen"
        "Berendsen" "CSVR" Langevin "Nosé-Hoover" "Nosé-Hoover chain" "Velocity rescaling" Other user-specified
        value if none of the above apply. For "μVT": "GCMC" – Grand Canonical Monte Carlo Other user-specified
        value if none of the above apply. For "NPT": "Andersen" "Berendsen" "CauchyStat" "Nosé-Hoover style"
        "Parrinello-Rahman" Other user-specified value if none of the above apply. For "NσT": "CauchyStat"
        "Parrinello-Rahman" Other user-specified value if none of the above apply. For "μPT": User-specified
        value. For "μσT": User-specified value. For "NPH": "Nosé-Hoover style" Other user-specified value
        if none of the above apply. For "NσH": User-specified value. Otherwise: User-specified value.
    - name: description
      required: false
      description: Explanatory text about the constraint and method used to impose it.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: false
      legacy_values: A string containing the constraint description.
    - name: td-parameter
      required: false
      description: A fixed variable associated with the specified thermodynamic constraint.
      type: null
      extent: null
      kind: null
      recommended-unit: null
      values: null
      repeatable: true
      legacy_values: Contains SubSubProperties as defined in the table below.
      subproperties:
      - name: name
        required: true
        description: >-
          The designation of the parameter associated with the specified thermodynamic constraint.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: A string containing the name of the thermodynamic constraint parameter.
      - name: value
        required: true
        description: The data associated with the thermodynamic constraint parameter.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: >-
          An integer, real, boolean, or string containing the thermodynamic constraint parameter value.
      - name: unit
        required: true
        description: >-
          A standardized string or identifier that defines the dimension or measurement system of the associated
          value.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: >-
          A string containing the units of the value in the [GNU unit convention](https://www.gnu.org/software/units/)
          (or the text "dimensionless").
      - name: description
        required: false
        description: >-
          An explanation of the meaning, source, or purpose of the thermodynamic constraint parameter.
        type: null
        extent: null
        kind: null
        recommended-unit: null
        values: null
        repeatable: false
        legacy_values: >-
          A string explaining the thermodynamic constraint parameter (e.g. "The damping parameter for the
          Langevin thermostat").
