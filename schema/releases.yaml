# Releases of the MatCore standard, newest first (decision record 0010). The newest entry is the current
# version. scripts/build_docs.py generates the Revision History page and the version line on every standard
# page from this file. A release adds an entry here in one commit on main, then tags that commit vX.Y.Z.
# description: one item per line of the history table's cell.
releases:
  - version: 0.9.0
    date: 2026-11-27
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- A record can describe the quantities a dataset holds (name, unit, shape, type, what each value belongs to and is divided by), which results were kept, and inputs taken from other datasets"
      - "- A structure can describe a population of many compositions; interfaces and grain boundaries give each side's plane, direction and termination, and the orientation relationship"
      - "- New section 2.9 Geometric Construction (GC), for structures built by rules without a model or energies"
      - "- PIM describes how a machine-learned potential was trained, and covers models that also predict charges, dipoles or polarizabilities"
      - "- DFT: a k-point mesh chosen by a spacing or density records its rule"
      - "- New roles (guidance, trained model, container image), access rights in COAR's terms, and the reserved value Unknown for unrecorded information"
      - "- Annex U gains seven Kinds and thirteen units, among them energy per area, dipole moment, polarizability and thermal conductivity; symbols may use * for multiplication"
      - "- The JSON Schema requires the name and link of a license outside the SPDX list"
    approved_by: E. B. Tadmor
  - version: 0.8.0
    date: 2026-11-23
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- A JSON Schema generated from the standard is published with each version; it checks a record's names, structure, types, shapes, values and units"
      - "- New §1.4 Serialization: what any serialization must preserve, and the JSON serialization; a record's own properties are named with the prefix x-"
      - "- Preamble: MatCore is a reporting standard; which part of a record holds which metadata; a property is identified by its path; how a change to the standard is proposed and decided"
      - "- DFT: the core-electron treatment is All-electron or Frozen core, PAW being a kind of pseudopotential dataset; localized-orbital-basis-set is renamed atom-centered-basis-set"
      - "- PS: a constraint on, or a potential applied to, a group of particles (fixed, tethered, restricted, rigid, holonomic, flexible boundaries, walls, indenters, driving potentials)"
      - "- Derived Property: the Mechanical, Thermodynamic and Transport families widened (strengths, hardness, melting temperature, viscosity, defect mobilities)"
      - "- A generic parameter whose value is a string or a bool has no unit; the matcore container comes first in the minimal metadata"
      - "- Renaming of some properties to the singular (e.g. boundary-conditions to boundary-condition, charge-interactions to charge-interaction)"
    approved_by: E. B. Tadmor
  - version: 0.7.0
    date: 2026-11-22
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- Every section complete: PIM, PS, MBPT, ML, PF and Derived now give every property a type, extent, Kind, recommended unit and structured values"
      - "- Computations: structures and computations are labelled; a computation gives its method, its task and the other computations whose results it uses, each with a role; every method section's properties sit in settings blocks naming the computations they describe; a record explains the dataset, not the workflow that produced it"
      - "- New section 2.3 Particle Interaction Model (PIM); Molecular Dynamics becomes Particle Simulation (PS), covering molecular dynamics, molecular statics and Monte Carlo; the method of a computation names the section that describes it, with new terms TB, PIM, PS and DP"
      - "- Derived properties are attached to the computations that obtain them, of any method; post-processing is a method class, with its own method DP"
      - "- ML describes a model, how it was trained and how good it is, and how the dataset was produced from it; PF describes its equations, free energy terms, domain, boundary conditions and numerical method"
      - "- A required matcore container gives the standard version, the record's identifier, the dataset version, the record's author and its creation date"
      - "- DFT: species of pseudopotentials and basis sets, a stress tolerance, a dispersion correction, smearing as its own block, a LAPW basis cutoff and initial magnetic moments"
      - "- Conditions gain a net charge, and a material component its magnetic order; Annex U gains the Kinds ElectricCharge and MagneticMoment and the units e, C, mu_B and J/T"
      - "- Examples are written in JSON, the first serialization; term definitions are listed one per line"
      - "- Renaming of some properties (e.g. simulation-conditions to conditions, the md section to ps)"
    approved_by: E. B. Tadmor
  - version: 0.6.0
    date: 2026-11-08
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- DFT section complete: every property has a type, extent, Kind, recommended unit and structured values"
      - "- Structure and composition: a material component is described by one chemical formula (with variables, groups and user-defined species) and by its form, role, fraction and phase; isomers and polymorphs are identified by InChI, SMILES or AFLOW prototype labels"
      - "- Simulation conditions: every condition is defined as imposed; a varying value is given as qualified entries (initial, final, average, minimum, maximum); the simulation type is classified by thermodynamic state, openness, time dependence and spatial uniformity; added electric and magnetic fields, body force, electrode potential and chemical potential; number density removed"
      - "- Software: one entry per layer (simulation code, calculation method, workflow framework, script), with exact identification, dependencies and build options; files carry an encoding and checksums"
      - "- Added publication, dataset location and the author of the metadata record; licenses as SPDX identifiers with name, link and scope; provenance agents described like creators"
      - "- Pure numbers are written without a unit; generic parameters defined in the Preamble"
      - "- Annex U gains four Kinds and five units; Annex I gains InChI, SMILES and AFLOW"
      - "- Preamble: goals of FAIR data and AI readiness, acronyms defined, methods that supply energies and forces distinguished, and the order of array values"
      - "- Renaming of some properties (e.g. citation to publication, pseudopotential to pseudopotential-or-paw, method to method-density)"
    approved_by: E. B. Tadmor
  - version: 0.5.0
    date: 2026-11-04
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- Minimal section complete: every property has a type, extent, Kind, recommended unit and structured values"
      - "- Every numerical value is written as a value with its unit; pure numbers use the unit dimensionless"
      - "- Added Annex I, Identifier Schemes; creators, contributors, affiliations and funders carry scheme-tagged identifiers"
      - "- Renaming of some properties (e.g. phase to phases, links to link, comments to comment)"
      - "- Restructured properties (e.g. funder as a name and an identifier, checksum with its algorithm)"
      - "- Preamble: rules for units, Type, Extent, Kind and Recommended unit; the original list nesting restored"
      - "- Corrections to unit symbols and property names, and to text lost in the migration from the Google Doc"
    approved_by: E. B. Tadmor
  - version: 0.4.0
    date: 2026-11-01
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- Standard moved from the Google Doc to the GitHub repository and website; the YAML schema is the source of truth"
      - "- Renaming of some properties (e.g. material to material-component)"
      - "- Added Annex U, the MatCore Unit Table"
      - "- Section introductions and examples shown with each section"
    approved_by: E. B. Tadmor
  - version: 0.3.0
    date: 2026-04-06
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- Added phase field method standard"
      - "- Changed from JSON to XML for examples"
      - "- Replaced key-value-unit lists with nested sub-properties"
    approved_by: E. B. Tadmor
  - version: 0.2.0
    date: 2026-03-19
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "Changes based on MatCore Standard Committee review:"
      - "- Renaming of some properties"
      - "- Addition of properties"
      - "- Changes to property definitions and controlled vocabulary"
    approved_by: E. B. Tadmor
  - version: 0.1.0
    date: 2026-02-23
    change_type: Minor (Breaking)
    sections: Entire document
    description:
      - "Initial release of draft proposal"
    approved_by: E. B. Tadmor
