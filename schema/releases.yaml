# Releases of the MatCore standard, newest first (decision record 0010). The newest entry is the current
# version. scripts/build_docs.py generates the Revision History page and the version line on every standard
# page from this file. A release adds an entry here in one commit on main, then tags that commit vX.Y.Z.
# description: one item per line of the history table's cell.
releases:
  - version: 0.6.0
    date: 2026-11-08
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- DFT section complete: every property has a type, extent, Kind, recommended unit and structured values"
      - "- Structure and composition: a material component is described by one chemical formula (with variables, groups and user-defined species) and by its form, role, fraction and phase; isomers and polymorphs are identified by InChI, SMILES or AFLOW prototype labels"
      - "- Simulation conditions: every condition is defined as imposed; a varying value is given as qualified entries (initial, final, average, minimum, maximum); the simulation type is classified by thermodynamic state, openness, time dependence and spatial uniformity; added electric and magnetic fields, body force, electrode potential and chemical potential; number density removed"
      - "- Software: one entry per layer (simulation code, calculation method, workflow framework, script), with exact identification, dependencies and build options; files carry an encoding and checksums"
      - "- Added publication, dataset location and the author of the metadata record; licenses as SPDX identifiers with name, link and scope; provenance agents described like creators"
      - "- Pure numbers are written without a unit; generic parameters defined in the Preamble"
      - "- Annex U gains four Kinds and five units; Annex I gains InChI, SMILES and AFLOW"
      - "- Preamble: goals of FAIR data and AI readiness, acronyms defined, methods that supply energies and forces distinguished, and the order of array values"
      - "- Renaming of some properties (e.g. citation to publication, pseudopotential to pseudopotential-or-paw, method to method-density)"
    approved_by: E. B. Tadmor
  - version: 0.5.0
    date: 2026-11-04
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- Minimal section complete: every property has a type, extent, Kind, recommended unit and structured values"
      - "- Every numerical value is written as a value with its unit; pure numbers use the unit dimensionless"
      - "- Added Annex I, Identifier Schemes; creators, contributors, affiliations and funders carry scheme-tagged identifiers"
      - "- Renaming of some properties (e.g. phase to phases, links to link, comments to comment)"
      - "- Restructured properties (e.g. funder as a name and an identifier, checksum with its algorithm)"
      - "- Preamble: rules for units, Type, Extent, Kind and Recommended unit; the original list nesting restored"
      - "- Corrections to unit symbols and property names, and to text lost in the migration from the Google Doc"
    approved_by: E. B. Tadmor
  - version: 0.4.0
    date: 2026-11-01
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- Standard moved from the Google Doc to the GitHub repository and website; the YAML schema is the source of truth"
      - "- Renaming of some properties (e.g. material to material-component)"
      - "- Added Annex U, the MatCore Unit Table"
      - "- Section introductions and examples shown with each section"
    approved_by: E. B. Tadmor
  - version: 0.3.0
    date: 2026-04-06
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "- Added phase field method standard"
      - "- Changed from JSON to XML for examples"
      - "- Replaced key-value-unit lists with nested sub-properties"
    approved_by: E. B. Tadmor
  - version: 0.2.0
    date: 2026-03-19
    change_type: Minor (Breaking)
    sections: Across document
    description:
      - "Changes based on MatCore Standard Committee review:"
      - "- Renaming of some properties"
      - "- Addition of properties"
      - "- Changes to property definitions and controlled vocabulary"
    approved_by: E. B. Tadmor
  - version: 0.1.0
    date: 2026-02-23
    change_type: Minor (Breaking)
    sections: Entire document
    description:
      - "Initial release of draft proposal"
    approved_by: E. B. Tadmor
